ord sur l'importance du thème, ça vous donne le temps de réfléchir à vos arguments.","phrase":"« À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique. Personnellement, je pense que… Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples. »"},{"n":"2","titre":"Premier argument","color":"var(--cat-travail)","duree":"~1 min","desc":"Toujours le même schéma en 4 temps : idée → explication → exemple → mini-conclusion. L'exemple (votre vie, votre pays, la société) est ce qui fait monter la note.","phrase":"« Tout d'abord, … En effet, … Par exemple, … C'est pourquoi… »"},{"n":"3","titre":"Deuxième argument","color":"var(--cat-education)","duree":"~1 min","desc":"Même schéma. Si vous avez encore du temps, ajoutez un 3ᵉ argument avec « Par ailleurs / Qui plus est… » pour remplir le temps.","phrase":"« Ensuite, … / De plus, … Cela permet de… C'est notamment le cas de… »"},{"n":"4","titre":"Nuance / contre-argument","color":"var(--cat-medias)","duree":"~45 s","desc":"LE réflexe B2+ : reconnaître l'avis opposé, puis y répondre. La nuance visible est le différenciateur B2→C1 le plus net. Ne la sautez jamais.","phrase":"« Cependant, certaines personnes pensent que… Je comprends ce point de vue, mais je crois que… » ou le pivot plus fort : « Certes…, il n'en reste pas moins que… »"},{"n":"5","titre":"Conclusion","color":"var(--cat-sante)","duree":"~30 s","desc":"Reprendre sa position en la justifiant. Ouverture facultative à la fin : « On pourrait même se demander si… »","phrase":"« En conclusion, je pense que…, car… » / « Pour résumer, … » / « Finalement, je dirais que… »"}]},{"type":"callout","variant":"accent","title":"Deux astuces d'examinateur.","html":"(1) Vos <strong>exemples peuvent être réels OU inventés</strong> — on n'évalue pas la véracité, mais la manière de vous exprimer ; n'hésitez pas à inventer un exemple parlant. (2) Dans l'intro, vous pouvez <strong>généraliser d'abord</strong> (parler de l'importance du thème) avant d'annoncer votre opinion — ça vous donne le temps de réfléchir."},{"type":"callout","variant":"warn","title":"Orthographe.","html":"« je vous donnera<strong>i</strong> » = futur simple, sans -s. Le conditionnel « donnerais » est une faute à l'écrit ; à l'oral, la prononciation est quasi identique, mais visez le futur simple."}]},{"band":"Comprendre","id":"t3-modele-express","title":"Le modèle express à mémoriser","blocks":[{"type":"prose","html":"<p>Une trame courte qui marche pour presque tous les sujets — apprenez-la <strong>par cœur</strong>. Seuls les blancs <em>(en orange)</em> changent d'un sujet à l'autre ; tout le reste, vous le dites mot pour mot.</p>"},{"type":"template","html":"À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique.\nPersonnellement, je pense que <span class=\"blk\">_______</span>.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, <span class=\"blk\">_______</span>. En effet, <span class=\"blk\">_______</span>. Par exemple, <span class=\"blk\">_______</span>.\n\nEnsuite, <span class=\"blk\">_______</span>. Cela permet de <span class=\"blk\">_______</span>.\n\nCependant, certaines personnes pensent que <span class=\"blk\">_______</span>.\nJe comprends ce point de vue, mais je crois que <span class=\"blk\">_______</span>.\n\nEn conclusion, je pense que <span class=\"blk\">_______</span>, car <span class=\"blk\">_______</span>.","copy":"À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique.\nPersonnellement, je pense que _______.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, _______. En effet, _______. Par exemple, _______.\n\nEnsuite, _______. Cela permet de _______.\n\nCependant, certaines personnes pensent que _______.\nJe comprends ce point de vue, mais je crois que _______.\n\nEn conclusion, je pense que _______, car _______."}]},{"band":"Comprendre","id":"t3-criteres","title":"Ce que l'examinateur évalue","blocks":[{"type":"prose","html":"<p>Les critères de notation, et votre parade pour chacun. Repère de barème : <strong>B2 = 10/20</strong> (NCLC 7) ; <strong>12/20</strong> = NCLC 8 ; <strong>14/20</strong> passe en C1/NCLC 9.</p>"},{"type":"table","headers":["Critère","Ce qui vous donne le B2"],"rows":[["<strong>Lexique</strong>","Vocabulaire précis du thème, phrases complexes (relatives, subordonnées) — pas <em>chose / faire / beaucoup</em>"],["<strong>Grammaire</strong>","Temps et accords fiables ; <strong>subjonctif</strong> correct après « bien que », « il faut que »"],["<strong>Fluidité</strong>","Tempo régulier sur 4 min 30, sans long silence — un « euh » court passe, pas les chaînes de « euh »"],["<strong>Cohérence</strong>","Des connecteurs au-delà de <em>et / mais</em> : tout d'abord, en effet, cependant, en conclusion"],["<strong>Interaction</strong>","Surtout jugée en Tâches 1–2 ; en Tâche 3, restez simplement posé(e) si l'examinateur réagit"],["<strong>Prononciation</strong>","Une intonation qui soutient le sens (secondaire au B2)"]]}]},{"band":"Comprendre","id":"t3-reflexes","title":"Les 7 réflexes du jour J","blocks":[{"type":"reflexes","items":["<strong>Choisissez le camp le plus facile à défendre</strong>, pas forcément votre vraie opinion.","<strong>Un exemple concret par argument</strong> (votre vie, votre pays, la société) — c'est ce qui fait monter la note.","<strong>Reliez tout avec des connecteurs</strong> : d'abord, en effet, par exemple, cependant, en conclusion.","<strong>Glissez une concession</strong> (« Certes…, il n'en reste pas moins que… ») : la marque du B2.","<strong>Développez 2 bons arguments</strong> plutôt que 4 superficiels.","<strong>Parlez jusqu'au bout</strong> des 4 min 30, calmement : le silence pénalise plus que l'erreur.","<strong>Acceptez de faire des erreurs</strong> : la fluidité et la clarté comptent plus que la perfection."]}]},{"band":"Voir","id":"t3-trame-fixe","title":"La trame fixe (à mémoriser une seule fois)","blocks":[{"type":"prose","html":"<p>Les 6 modèles ci-dessous suivent <strong>exactement la même trame</strong>. Dans chaque réponse, ce qui est <strong>en gras est fixe</strong> — vous le dites mot pour mot, quel que soit le sujet. Le reste est la seule partie qui change : votre position, vos arguments, vos exemples.</p>"},{"type":"template","html":"À mon avis, c'est un sujet très actuel et important.\nPersonnellement, je pense que <span class=\"blk\">_______</span>.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, <span class=\"blk\">_______</span>. En effet, <span class=\"blk\">_______</span>. Par exemple, <span class=\"blk\">_______</span>.\n\nEnsuite, <span class=\"blk\">_______</span>. Cela permet de <span class=\"blk\">_______</span>. C'est notamment le cas de <span class=\"blk\">_______</span>.\n\nCependant, certaines personnes pensent que <span class=\"blk\">_______</span>.\nJe comprends ce point de vue, mais je crois que <span class=\"blk\">_______</span>.\n\nEn conclusion, je pense que <span class=\"blk\">_______</span>, car <span class=\"blk\">_______</span>.","copy":"À mon avis, c'est un sujet très actuel et important.\nPersonnellement, je pense que _______.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, _______. En effet, _______. Par exemple, _______.\n\nEnsuite, _______. Cela permet de _______. C'est notamment le cas de _______.\n\nCependant, certaines personnes pensent que _______.\nJe comprends ce point de vue, mais je crois que _______.\n\nEn conclusion, je pense que _______, car _______."},{"type":"callout","variant":"warn","html":"« je vous donnera<strong>i</strong> » = futur simple, sans -s (le conditionnel « donnerais » est une faute à l'écrit ; à l'oral, la prononciation est quasi identique)."}]},{"band":"Voir","id":"t3-exemple-1","title":"Exemple 1 — Apprendre une langue dès l'enfance","blocks":[{"type":"modelAnswer","title":"« Est-il préférable d'apprendre une langue étrangère dès l'enfance ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important. Personnellement, je pense qu'</strong>il est préférable d'apprendre une langue étrangère dès l'enfance. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> les enfants apprennent plus facilement les langues que les adultes. <strong>En effet,</strong> leur cerveau est beaucoup plus flexible, et ils n'ont pas encore les blocages psychologiques des adultes. <strong>Par exemple,</strong> un enfant de six ou sept ans peut imiter parfaitement les sons d'une nouvelle langue, alors qu'un adulte aura souvent un accent marqué."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> apprendre une langue dès l'enfance ouvre la porte à une nouvelle culture. <strong>Cela permet de</strong> développer la curiosité et la tolérance, et de préparer son avenir dans un monde globalisé. <strong>C'est notamment le cas</strong> des enfants qui apprennent l'anglais et le français au Canada : cette base linguistique acquise à l'école primaire leur ouvre beaucoup plus de portes sur le marché du travail."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent que</strong> les adultes aussi peuvent très bien apprendre des langues et que la motivation compte plus que l'âge. <strong>Je comprends ce point de vue, mais je crois que</strong> commencer tôt reste un avantage considérable, même si l'âge n'est jamais une barrière absolue. Par exemple, moi, je suis arrivé au Canada à l'âge adulte et j'ai encore un accent marqué. Si j'étais arrivé avec un fils, il aurait appris l'anglais et le français sans effort à l'école, alors que moi, j'ai dû travailler dur pour y arriver."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> l'apprentissage d'une langue étrangère dès l'enfance est une excellente opportunité, <strong>car</strong> cela facilite la prononciation et la mémorisation, ouvre à de nouvelles cultures et prépare les jeunes à un avenir plus riche."}]}]},{"band":"Voir","id":"t3-exemple-2","title":"Exemple 2 — Les jeux vidéo, un danger ?","blocks":[{"type":"modelAnswer","title":"« Les jeux vidéo constituent-ils un danger pour les joueurs ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important. Personnellement, je pense que</strong> les jeux vidéo ne sont pas dangereux, à condition d'en faire un usage modéré. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> les jeux vidéo permettent de développer certaines compétences. <strong>En effet,</strong> ils stimulent la réflexion stratégique, la coordination et la prise de décision rapide. <strong>Par exemple,</strong> dans mon expérience personnelle, jouer de manière raisonnable m'aide à réduire le stress quotidien après le travail."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> les jeux en ligne sont un véritable outil de socialisation. <strong>Cela permet de</strong> rencontrer des gens du monde entier et d'avoir des amitiés durables. <strong>C'est notamment le cas</strong> des joueurs qui retrouvent la même équipe chaque semaine et finissent par créer de véritables liens."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent que</strong> les jeux vidéo entraînent des problèmes d'addiction et d'isolement. <strong>Je comprends ce point de vue, mais je crois que</strong> ce n'est pas le jeu en soi qui pose problème : c'est l'excès qui constitue le véritable danger. Par exemple, si une personne joue tous les jours pendant plusieurs heures, elle risque de développer des problèmes d'isolement social ou de dépression."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> les jeux vidéo ne représentent pas un danger pour la majorité des joueurs, <strong>car</strong> tout dépend de l'usage qu'on en fait — la modération fait toute la différence."}]}]},{"band":"Voir","id":"t3-exemple-3","title":"Exemple 3 — Vivre sans connaître la langue","blocks":[{"type":"modelAnswer","title":"« Est-il possible de vivre dans un pays sans connaître sa langue ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important. Personnellement, je pense qu'</strong>il est possible de vivre dans un pays sans connaître sa langue, mais que ce sera difficile et limité. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> la langue est essentielle pour s'intégrer dans la société. <strong>En effet,</strong> elle permet de communiquer avec les habitants, de comprendre les règles et de profiter des services. <strong>Par exemple,</strong> une personne qui ne parle pas la langue locale peut avoir des difficultés à trouver un emploi ou à consulter un médecin."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> apprendre la langue du pays facilite toute la vie quotidienne. <strong>Cela permet de</strong> créer des relations sociales et de mieux comprendre la culture. <strong>C'est notamment le cas</strong> des immigrés qui se font des amis locaux et se sentent rapidement chez eux dans leur pays d'accueil."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent que</strong> l'on peut vivre sans apprendre la langue, surtout dans les grandes villes internationales où beaucoup de gens parlent anglais, ou dans des quartiers comme Chinatown ou Little Italy. <strong>Je comprends ce point de vue, mais je crois que</strong> cela empêche une véritable intégration et peut isoler la personne."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> vivre dans un pays sans connaître sa langue est possible mais pas idéal, <strong>car</strong> la langue est essentielle pour s'intégrer pleinement et vivre une vie plus riche et autonome."}]}]},{"band":"Voir","id":"t3-exemple-4","title":"Exemple 4 — Une journée pour les droits des femmes","blocks":[{"type":"modelAnswer","title":"« Pensez-vous qu'il soit nécessaire de réserver une journée pour les droits des femmes ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important. Personnellement, je pense qu'</strong>il est nécessaire de réserver une journée pour les droits des femmes. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> cette journée permet de sensibiliser la société aux inégalités qui existent encore aujourd'hui. <strong>En effet,</strong> dans de nombreux pays, les femmes n'ont pas les mêmes opportunités que les hommes, notamment en matière de salaire ou d'accès à certains postes. <strong>Par exemple,</strong> jusqu'à récemment, dans certains pays, les femmes n'avaient même pas le droit de conduire."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> cette journée sert à célébrer les progrès réalisés et à encourager les actions futures. <strong>Cela permet de</strong> mobiliser les gouvernements, les entreprises et les citoyens pour continuer à défendre l'égalité. <strong>C'est notamment le cas</strong> des campagnes organisées chaque 8 mars, qui donnent une visibilité mondiale à ce combat."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent que</strong> les droits des femmes devraient être respectés tous les jours, et qu'une journée spécifique n'est donc pas nécessaire. <strong>Je comprends ce point de vue, mais je crois que</strong> cette journée reste essentielle pour rappeler que le combat n'est pas encore terminé."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> consacrer une journée aux droits des femmes est important, <strong>car</strong> elle permet de sensibiliser, de célébrer les progrès et de continuer à lutter pour l'égalité."}]}]},{"band":"Voir","id":"t3-exemple-5","title":"Exemple 5 — Voyager transforme une personne","blocks":[{"type":"modelAnswer","title":"« Voyager à l'étranger peut transformer une personne. Qu'en pensez-vous ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important. Personnellement, je pense que</strong> voyager à l'étranger peut réellement transformer une personne, même si tout dépend de la manière dont on voyage. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> voyager nous confronte à d'autres cultures et à d'autres modes de vie. <strong>En effet,</strong> sortir de sa zone de confort oblige à s'adapter, à remettre en question ses habitudes et à devenir plus ouvert d'esprit. <strong>Par exemple,</strong> une personne qui découvre un pays où le rythme de vie est très différent peut revenir avec un regard nouveau sur sa propre existence."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> le voyage développe l'autonomie et la confiance en soi. <strong>Cela permet d'</strong>apprendre à gérer l'imprévu, à communiquer dans une autre langue et à résoudre des problèmes seul. <strong>C'est notamment le cas</strong> des jeunes qui partent étudier à l'étranger et qui reviennent beaucoup plus mûrs."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent qu'</strong>un simple voyage touristique de quelques jours ne change pas vraiment quelqu'un. <strong>Je comprends ce point de vue, mais je crois que</strong> même un court séjour laisse toujours une trace, à condition de rester curieux et ouvert."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> voyager à l'étranger peut véritablement transformer une personne, <strong>car</strong> cela enrichit l'esprit, renforce le caractère et change durablement notre façon de voir le monde."}]}]},{"band":"Voir","id":"t3-exemple-6","title":"Exemple 6 — Travailler à l'étranger","blocks":[{"type":"modelAnswer","title":"« Il est facile de travailler à l'étranger. Êtes-vous d'accord ? »","parts":[{"label":"Introduction","html":"<strong>À mon avis, c'est un sujet très actuel et important,</strong> à une époque où de plus en plus de personnes partent travailler à l'étranger. <strong>Personnellement, je pense que</strong> ce n'est pas si facile : c'est une expérience enrichissante, mais elle est loin d'être simple, surtout au début. <strong>Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.</strong>"},{"label":"Premier argument","html":"<strong>Tout d'abord,</strong> la barrière de la langue rend le travail épuisant, même avec un bon niveau. <strong>En effet,</strong> au travail, il ne suffit pas de se débrouiller : il faut convaincre, négocier et comprendre les nuances et l'humour des collègues. <strong>Par exemple,</strong> une personne qui travaille dans une langue étrangère constate souvent qu'une simple réunion lui demande beaucoup plus d'énergie que dans sa langue maternelle."},{"label":"Deuxième argument","html":"<strong>Ensuite,</strong> il y a les obstacles administratifs et la reconnaissance des diplômes. <strong>Cela permet de</strong> comprendre pourquoi beaucoup d'immigrés qualifiés doivent recommencer en bas de l'échelle. <strong>C'est notamment le cas</strong> des médecins ou des ingénieurs étrangers, qui doivent souvent refaire des études ou accepter un poste moins qualifié à leur arrivée."},{"label":"Nuance","html":"<strong>Cependant, certaines personnes pensent que</strong> c'est plus facile qu'avant : dans certains secteurs comme l'informatique, les entreprises recrutent à l'international et l'anglais suffit souvent. <strong>Je comprends ce point de vue, mais je crois qu'</strong>il n'en reste pas moins que l'adaptation demande du temps, des efforts et beaucoup de patience — car chaque pays a aussi ses codes professionnels (la hiérarchie, la ponctualité, la façon de donner son avis), et il faut du temps pour les décoder."},{"label":"Conclusion","html":"<strong>En conclusion, je pense que</strong> travailler à l'étranger n'est pas facile, <strong>car</strong> il faut surmonter la barrière de la langue, les démarches administratives et les différences culturelles. Mais ces difficultés sont temporaires et formatrices : le jeu en vaut la chandelle."}]}]},{"band":"S'entraîner","id":"t3-frequence","title":"Les thèmes par fréquence","blocks":[{"type":"prose","html":"<p>Analyse de <strong>703 sujets</strong> relevés de janvier 2022 à juin 2026, classés par thème. À retenir : les <strong>6 premiers thèmes représentent ~78 %</strong> de tous les sujets. Préparez solidement ces six familles et vous êtes prêt(e) pour la grande majorité des tirages.</p>"},{"type":"frequency","bars":[{"label":"Immigration / vivre à l'étranger / intégration","pct":20,"color":"var(--cat-immigration)"},{"label":"Travail / emploi / salaire / carrière","pct":19,"color":"var(--cat-travail)"},{"label":"Éducation / école / études / diplômes","pct":12,"color":"var(--cat-education)"},{"label":"Santé / alimentation / mode de vie","pct":10,"color":"var(--cat-sante)"},{"label":"Télévision / médias / information","pct":9,"color":"var(--cat-medias)"},{"label":"Technologie / Internet / réseaux sociaux","pct":9,"color":"var(--cat-techno)"}]}]},{"band":"S'entraîner","id":"t3-priorites","title":"Les sujets prioritaires","blocks":[{"type":"prose","html":"<p>Ces énoncés précis (ou de très proches variantes) réapparaissent dans de nombreuses sessions — ce sont les <strong>priorités absolues</strong> à travailler d'abord :</p>"},{"type":"phrasebank","groups":[{"label":"Immigration / intégration","phrases":["Vivre dans un pays étranger est difficile. Êtes-vous d'accord ? (le sujet le plus répété du corpus)","Travailler à l'étranger est facile. Qu'en pensez-vous ?","Est-il nécessaire de vivre dans un pays pour connaître sa culture ?","Changer de pays, c'est changer de culture. Qu'en pensez-vous ?","Pour bien s'intégrer dans un nouveau pays, faut-il renoncer à ses traditions ?","Est-il facile de se faire des amis quand on s'installe dans un nouveau pays ?","Il est facile de s'intégrer dans un pays étranger quand on est jeune. Qu'en pensez-vous ?"]},{"label":"Travail","phrases":["Il faut aimer son travail pour être productif. Qu'en pensez-vous ?","Faut-il faire travailler les gens jusqu'à 70 ans ?","Le salaire est l'aspect le plus important d'un emploi. Êtes-vous d'accord ?","Est-il bon de faire plusieurs métiers dans sa carrière ?","Que pensez-vous du télétravail ?"]},{"label":"Éducation","phrases":["Pour gagner beaucoup d'argent, il est indispensable d'avoir fait des études. Êtes-vous d'accord ?","Avoir de bons résultats scolaires permet de réussir dans la vie. Qu'en pensez-vous ?","La priorité de l'école, c'est d'enseigner le programme scolaire. Qu'en pensez-vous ?"]},{"label":"Technologie / téléphone","phrases":["Peut-on vivre sans Internet ?","Avec Internet, le monde est devenu un village. Êtes-vous d'accord ?","Faut-il interdire aux enfants l'utilisation du téléphone portable ?","Les réseaux sociaux sont une perte de temps. Êtes-vous d'accord ?"]},{"label":"Médias / télévision","phrases":["Certaines personnes choisissent de ne jamais regarder la télévision. Qu'en pensez-vous ?","Regarder la télévision permet de s'instruire. Qu'en pensez-vous ?","Les journaux télévisés ne devraient pas diffuser d'images violentes. Êtes-vous d'accord ?"]},{"label":"Santé / mode de vie","phrases":["Pour être en bonne santé, faut-il arrêter de manger de la viande ?","Le stress est un bon stimulant. Qu'en pensez-vous ?","De plus en plus de personnes deviennent végétariennes. Qu'en pensez-vous ?"]},{"label":"Environnement","phrases":["Les transports en commun doivent être gratuits en ville. Est-ce une bonne idée ?","De nos jours, peut-on vivre sans voiture ?","Tout le monde peut réduire ses déchets. Qu'en pensez-vous ?"]},{"label":"Argent / bonheur","phrases":["L'argent fait-il le bonheur ?","Il faut gagner beaucoup d'argent pour profiter de la vie. Êtes-vous d'accord ?"]}]}]},{"band":"S'entraîner","id":"t3-arguments","title":"Trouver des arguments par sujet","blocks":[{"type":"prose","html":"<p>Choisissez un thème et un sujet : pour chacun, retrouvez des arguments <strong>pour</strong>, des arguments <strong>contre</strong> et des <strong>nuances</strong> prêtes à intégrer dans la trame.</p>"},{"type":"argfinder"}]},{"band":"S'entraîner","id":"t3-banque","title":"S'entraîner avec la Banque","blocks":[{"type":"callout","variant":"accent","title":"Ouvrez la Banque des 214 réponses.","html":"Pour vous entraîner pour de bon : <strong>ouvrez la Banque des 214 réponses</strong> (accessible depuis le bouton « Banque » dans l'en-tête, en haut de page). Vous y trouverez les sujets 2026 dédupliqués et triés par fréquence, avec une <strong>réponse modèle B2 et un audio</strong> pour chacun — écoutez, puis faites du <em>shadowing</em>. Et avec <strong>/tcf-pratique examen</strong> : un sujet au hasard, zéro préparation, 4 min 30 chronométrées, puis un retour pédagogique."}]}]}],"vocab":{"id":"vocab","title":"Vocabulaire par thème","eyebrow":"Annexe A · Lexique","lede":"Lexique extensif bilingue (FR → EN) pour argumenter à l'oral du TCF (Tâche 3), classé par thème, du plus fréquent au moins fréquent. Les collocations marquées « → » (en gras) sont particulièrement utiles pour défendre un avis. Conseil : apprenez les mots en contexte, dans une phrase, avec l'audio — visez 5 à 8 collocations par thème prioritaire plutôt que des listes de mots nus.","se rançais","English"],"copyCol":0,"rows":[["Mieux vaut prévenir que guérir.","Prevention is better than cure."],["L'union fait la force.","Unity is strength."],["Qui ne risque rien n'a rien.","Nothing ventured, nothing gained."],["Petit à petit, l'oiseau fait son nid.","Little by little progress is made."],["Les petits ruisseaux font les grandes rivières.","Small efforts add up."],["Mieux vaut tard que jamais.","Better late than never."],["Il n'y a pas de fumée sans feu.","There's no smoke without fire."],["La fin ne justifie pas les moyens.","The end doesn't justify the means."],["Il ne faut pas vendre la peau de l'ours avant de l'avoir tué.","Don't count your chickens before they hatch."]]}]},{"id":"connecteurs-conseils","title":"Conseils d'emploi","blocks":[{"type":"reflexes","items":["Évitez de surutiliser <strong>du coup</strong> et <strong>en fait</strong> dans un monologue formel — gardez-les comme fillers occasionnels, préférez <strong>par conséquent / en réalité</strong>.","Une ou deux expressions imagées maximum, placées exprès : ça impressionne. En mettre partout sonne « appris par cœur ».","Variez les formules d'opinion : ne répétez pas « je pense que » — c'est le piège n°1 du niveau B1."]}]}]},"cram":{"id":"cram","title":"Avant d'entrer","eyebrow":"Veille d'examen","lede":"L'irréductible des trois tâches, à relire juste avant de passer : les amorces à dégainer sans réfléchir, la trame fixe de la Tâche 3, les structures B2 de la Tâche 2, et le réflexe qui sauve — parler jusqu'au bout.","sections":[{"id":"cram-essentiel","title":"L'essentiel, à relire juste avant","blocks":[{"type":"prose","html":"<p>Trois tâches, ~12 min en continu. <strong>T1</strong> : vous vous présentez (2 min, passé → présent → futur). <strong>T2</strong> : vous posez 12-18 questions (2 min de prépa + 3 min 30). <strong>T3</strong> : vous défendez un point de vue (~4 min 30, sans prépa). Le seul vrai ennemi commun : le <strong>blanc</strong>.</p>"},{"type":"phrasebank","groups":[{"label":"T1 — ouvrir sa présentation","phrases":["Bonjour ! Avec plaisir, je vais me présenter. Je m'appelle… et je viens de…","Bonjour ! Je m'appelle… , j'ai … ans et je suis …"]},{"label":"T2 — ouvrir poliment (demander un moment)","phrases":["Excusez-moi de vous déranger, auriez-vous quelques minutes à me consacrer ?","Puis-je vous poser quelques questions, si vous permettez ?"]},{"label":"T3 — lancer son opinion","phrases":["À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique.","Personnellement, je pense que…","De mon point de vue… / Pour ma part, j'estime que…"]}]},{"type":"template","html":"À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique.\nPersonnellement, je pense que <span class=\"blk\">_______</span>.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, <span class=\"blk\">_______</span>. En effet, <span class=\"blk\">_______</span>. Par exemple, <span class=\"blk\">_______</span>.\n\nEnsuite, <span class=\"blk\">_______</span>. Cela permet de <span class=\"blk\">_______</span>.\n\nCependant, certaines personnes pensent que <span class=\"blk\">_______</span>.\nJe comprends ce point de vue, mais je crois que <span class=\"blk\">_______</span>.\n\nEn conclusion, je pense que <span class=\"blk\">_______</span>, car <span class=\"blk\">_______</span>.","copy":"À mon avis, c'est un sujet très actuel et important / qui divise l'opinion publique.\nPersonnellement, je pense que _______.\nPour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.\n\nTout d'abord, _______. En effet, _______. Par exemple, _______.\n\nEnsuite, _______. Cela permet de _______.\n\nCependant, certaines personnes pensent que _______.\nJe comprends ce point de vue, mais je crois que _______.\n\nEn conclusion, je pense que _______, car _______."},{"type":"table","headers":["Structure B2 (T2)","Quand","Exemple"],"rows":[["<strong>Puis-je… ?</strong>","permission polie","Puis-je vous poser quelques questions ?"],["<strong>Y a-t-il… ?</strong>","si quelque chose existe","Y a-t-il un tarif réduit pour les étudiants ?"],["<strong>Faut-il que…</strong> + subjonctif","obligation / condition","Faut-il que je m'inscrive à l'avance ?"],["<strong>Si + présent…, … + futur</strong>","hypothèse","Si je m'inscris aujourd'hui, est-ce que je pourrai commencer demain ?"],["<strong>Le subjonctif</strong>","après « il faut que », « pour que »…","Que faut-il que je fasse pour réserver ?"],["<strong>Le conditionnel</strong>","demande polie, hypothèse","Pourriez-vous m'indiquer… ? · Je voudrais…"]],"copyCol":2},{"type":"callout","variant":"info","title":"Orthographe à fixer (T2)","html":"<strong>« puis-je »</strong> (trait d'union), <strong>« y a-t-il »</strong> (le <em>-t-</em> est euphonique, pas d'apostrophe), <strong>« faut-il que »</strong> (verbe <em>falloir</em>), <strong>« à me consacrer »</strong> (infinitif). Apportez votre propre stylo."},{"type":"phrasebank","groups":[{"label":"T1 — si l'examinateur vous interrompt","phrases":["Pour revenir à ce que je disais…","Comme je le mentionnais…","J'y reviens : …","Pour revenir à mon parcours, …"]}]},{"type":"callout","variant":"accent","html":"<strong>Parlez jusqu'au bout — le silence pénalise plus que l'erreur.</strong> Occupez tout le temps, calmement. La fluidité et la clarté comptent plus que la perfection grammaticale."}]}]},"args":{"themes":[{"theme":"Immigration, vie à l'étranger & intégration","subjects":[{"subject":"« Vivre dans un pays étranger est difficile. Êtes-vous d'accord ? »","pour":["La barrière de la langue complique les démarches les plus banales, comme ouvrir un compte bancaire ou prendre un rendez-vous médical, ce qui génère un stress permanent.","L'éloignement de la famille et des amis crée un sentiment de solitude profond, surtout lors des fêtes ou des moments difficiles où l'on aimerait être entouré des siens.","La méconnaissance des codes culturels expose à des malentendus fréquents, par exemple sur la manière de saluer ou de discuter avec un supérieur hiérarchique.","Les démarches administratives liées aux visas et aux titres de séjour sont souvent longues, coûteuses et angoissantes, car un refus peut bouleverser toute une vie.","La reconnaissance des diplômes étrangers reste laborieuse, si bien que de nombreux immigrants qualifiés se retrouvent contraints d'accepter des emplois en dessous de leurs compétences."],"contre":["Vivre à l'étranger offre une formidable occasion d'enrichissement personnel, car on découvre une nouvelle langue, une autre cuisine et d'autres façons de voir le monde.","De nombreux pays d'accueil disposent de structures dédiées aux nouveaux arrivants, comme des cours de langue gratuits ou des associations qui facilitent grandement l'installation.","Avec les outils numériques actuels, on reste en contact permanent avec ses proches par visioconférence, ce qui atténue beaucoup le sentiment d'éloignement.","La difficulté est souvent passagère : après quelques mois d'adaptation, la plupart des expatriés se sentent chez eux et tissent un réseau d'amis solide.","Sortir de sa zone de confort développe des qualités précieuses comme l'autonomie, la débrouillardise et l'ouverture d'esprit, qui servent toute la vie."],"nuances":["Certes, le début est éprouvant, mais cette difficulté dépend beaucoup du profil de chacun : un étudiant célibataire ne vit pas du tout la même expérience qu'une famille avec enfants.","Il est vrai que la langue représente un obstacle majeur, cependant la proximité entre le pays d'origine et le pays d'accueil change tout, car émigrer dans un pays francophone n'a rien à voir avec un départ pour l'Asie.","On ne peut nier les épreuves, toutefois c'est précisément en les surmontant que l'on grandit, de sorte que la difficulté et l'épanouissement vont souvent de pair."]},{"subject":"« Lorsque l'on vit dans un pays étranger, il faut fréquenter des gens de son pays d'origine. Qu'en pensez-vous ? »","pour":["Côtoyer ses compatriotes apporte un précieux réconfort moral, car partager sa langue maternelle et ses références culturelles soulage le mal du pays.","La communauté d'origine constitue un réseau d'entraide concret, où l'on échange des conseils pratiques sur le logement, l'emploi ou les démarches administratives.","Ces liens permettent de transmettre ses traditions à ses enfants, afin qu'ils ne perdent pas le contact avec leurs racines et la langue de leurs grands-parents.","Dans les premiers temps, parler sa langue maternelle évite l'épuisement mental que provoque l'effort constant de s'exprimer dans une langue étrangère.","Les associations de la diaspora organisent souvent des fêtes et des événements qui maintiennent un sentiment d'appartenance et brisent l'isolement."],"contre":["Se cantonner à sa communauté freine l'apprentissage de la langue locale, qui est pourtant la clé d'une véritable intégration sociale et professionnelle.","Le repli sur l'entre-soi peut conduire à la formation de ghettos, où l'on reproduit son mode de vie d'origine sans jamais s'ouvrir à la société d'accueil.","Se faire des amis parmi les habitants du pays permet de découvrir la culture de l'intérieur, bien au-delà des clichés touristiques.","Rester replié sur ses compatriotes prive d'opportunités professionnelles, car beaucoup d'emplois s'obtiennent grâce à un réseau local et à la maîtrise des codes du pays.","L'un des intérêts majeurs de l'expatriation est précisément la rencontre de l'altérité, et fuir ce contact reviendrait à passer à côté de l'expérience."],"nuances":["Certes, la communauté d'origine rassure au départ, mais elle ne devrait être qu'un point d'appui temporaire, et non un cocon qui empêche de s'ouvrir aux autres.","Il ne s'agit pas de choisir entre les deux : l'idéal est d'entretenir des liens avec ses compatriotes tout en cultivant des amitiés locales, pour garder ses racines sans se couper du pays d'accueil.","Tout dépend de la phase d'installation, car le soutien des compatriotes est crucial les premiers mois, alors qu'une ouverture plus large devient préférable une fois les bases acquises."]},{"subject":"« Quand on s'installe dans un nouveau pays, faut-il changer ses habitudes de vie ? »","pour":["S'adapter aux usages locaux facilite l'intégration et témoigne du respect que l'on porte à la société qui nous accueille.","Certaines habitudes doivent évoluer par nécessité pratique, comme les horaires des repas ou des commerces, qui diffèrent souvent d'un pays à l'autre.","Adopter de nouvelles coutumes permet de mieux comprendre la mentalité locale et de nouer des relations plus authentiques avec les habitants.","Le climat ou l'environnement imposent parfois de modifier son mode de vie, par exemple sa façon de se vêtir ou de se déplacer au quotidien.","S'ouvrir à de nouvelles habitudes enrichit l'existence, car on découvre des saveurs, des loisirs et des manières de vivre que l'on n'aurait jamais connus chez soi."],"contre":["Conserver ses habitudes preserve son identité et son équilibre psychologique, ce qui est essentiel pour se sentir bien dans une période déjà déstabilisante.","Renoncer à ses traditions reviendrait à se renier soi-même, alors que la diversité culturelle est précisément une richesse pour la société d'accueil.","On peut très bien vivre dans un pays tout en gardant ses pratiques alimentaires ou religieuses, sans pour autant nuire à autrui ni à son intégration.","Changer brutalement toutes ses habitudes provoque un choc culturel difficile à supporter, qui peut mener à un véritable mal-être.","Les habitants apprécient souvent de découvrir d'autres cultures, et conserver ses coutumes peut devenir un pont vers l'autre plutôt qu'une barrière."],"nuances":["Certes, il faut respecter les lois et les usages fondamentaux du pays, mais cela n'oblige nullement à abandonner ses traditions privées comme la cuisine ou les fêtes familiales.","Tout est question de mesure : il convient de distinguer les habitudes incompatibles avec la vie locale, qu'il faut adapter, des traditions inoffensives que l'on peut parfaitement préserver.","L'idéal n'est ni l'assimilation totale ni le refus de tout changement, mais une intégration équilibrée où l'on adopte certains usages tout en conservant l'essentiel de son identité."]},{"subject":"« L'immigration est une chance pour le pays qui accueille les nouveaux arrivants. Êtes-vous d'accord ? »","pour":["Les immigrants comblent souvent des pénuries de main-d'œuvre dans des secteurs essentiels comme la santé, l'agriculture ou le bâtiment, où les emplois restent difficiles à pourvoir.","L'arrivée de populations jeunes contribue à rajeunir une démographie vieillissante et à financer les systèmes de retraite par leurs cotisations.","La diversité culturelle apportée par l'immigration enrichit la gastronomie, les arts et la vie quotidienne, rendant la société plus dynamique et créative.","De nombreux immigrants créent des entreprises et génèrent ainsi de l'emploi et de la richesse pour l'ensemble du pays d'accueil.","Les talents venus de l'étranger renforcent l'innovation et la recherche, comme en témoignent les nombreux scientifiques et ingénieurs issus de l'immigration."],"contre":["Une arrivée massive et mal préparée peut peser sur les services publics comme le logement, les écoles ou les hôpitaux, déjà saturés dans certaines régions.","Sans politique d'intégration efficace, des tensions sociales peuvent naître entre les communautés et fragiliser la cohésion nationale.","Une partie de l'opinion craint que l'immigration ne tire les salaires vers le bas dans certains secteurs peu qualifiés.","L'intégration culturelle prend du temps, et un afflux trop rapide peut donner aux habitants un sentiment de perte de repères.","Les pays d'origine se trouvent parfois privés de leurs forces vives, ce qui aggrave leur propre développement par une fuite des cerveaux."],"nuances":["Certes, l'immigration apporte de nombreux bénéfices économiques, mais ces avantages ne se réalisent pleinement que si le pays investit dans l'accueil et l'intégration.","Tout dépend du contexte et du rythme : une immigration choisie et bien encadrée n'a pas les mêmes effets qu'un afflux soudain et désordonné.","Le débat oppose souvent les chiffres et le ressenti, car les études montrent un bilan globalement positif, alors que la perception de la population reste plus partagée."]},{"subject":"« Il est préférable de s'expatrier jeune plutôt qu'à un âge avancé. Qu'en pensez-vous ? »","pour":["Les jeunes apprennent les langues étrangères beaucoup plus facilement, ce qui accélère leur intégration et leur ouvre davantage de portes professionnelles.","À un jeune âge, on a moins d'attaches comme un emploi stable, un crédit immobilier ou des enfants scolarisés, ce qui rend le départ plus simple.","La jeunesse offre une plus grande capacité d'adaptation et une ouverture d'esprit qui facilitent l'acceptation d'un mode de vie différent.","Partir tôt permet de construire toute sa carrière et son réseau social dans le pays d'accueil, au lieu de devoir tout recommencer plus tard.","Les jeunes disposent de davantage de temps devant eux pour rentabiliser les efforts de l'installation et profiter pleinement de cette nouvelle vie."],"contre":["Les personnes plus âgées possèdent une expérience professionnelle et une maturité qui peuvent leur valoir de meilleurs postes et une installation plus confortable.","Avec l'âge, on dispose souvent d'économies plus importantes, ce qui réduit le stress financier lié à l'expatriation.","Un projet d'expatriation mûri à un âge avancé repose sur des choix réfléchis, alors que les jeunes partent parfois sur un coup de tête qu'ils regrettent.","Les retraités s'expatrient avec succès pour profiter d'un climat agréable ou d'un coût de la vie plus faible, ce qui prouve que l'âge n'est pas un obstacle.","La réussite d'une expatriation dépend davantage de la motivation et de la préparation que de l'âge auquel on franchit le pas."],"nuances":["Certes, la jeunesse facilite l'adaptation, mais elle s'accompagne aussi d'une certaine immaturité qui peut compliquer la gestion des difficultés rencontrées.","L'âge idéal dépend en réalité du projet : un départ pour étudier se conçoit jeune, tandis qu'une expatriation pour la retraite se vit logiquement plus tard.","Il ne faut pas opposer les générations, car chaque âge présente ses propres atouts, et c'est surtout la qualité de la préparation qui fait la différence."]},{"subject":"« Pour bien s'intégrer, maîtriser la langue du pays est plus important que connaître sa culture. Êtes-vous d'accord ? »","pour":["La langue est l'outil indispensable de la vie quotidienne, sans lequel on ne peut ni travailler, ni se soigner, ni accomplir la moindre démarche.","Parler la langue locale permet de nouer des amitiés et des relations professionnelles, qui constituent le véritable socle de l'intégration.","En apprenant la langue, on s'imprègne naturellement de la culture, car les expressions et l'humour véhiculent les valeurs et la mentalité d'un peuple.","La maîtrise de la langue inspire confiance aux employeurs et aux habitants, qui y voient un signe d'effort et de volonté d'intégration.","Sans la langue, on reste cantonné à un rôle de spectateur, incapable de comprendre les médias, les conversations ou les débats qui animent la société."],"contre":["Connaître les codes culturels évite des malentendus et des maladresses qui peuvent froisser les habitants, même lorsque l'on parle bien leur langue.","La culture façonne les comportements au travail, dans la famille et entre voisins, et l'ignorer expose à des conflits malgré une bonne maîtrise linguistique.","Certains parviennent à vivre et à travailler dans des milieux internationaux où l'anglais suffit, mais échouent à s'intégrer faute de comprendre la culture locale.","Le respect des usages et des sensibilités culturelles compte parfois davantage que la grammaire pour être accepté au sein d'une communauté.","La langue s'apprend avec le temps, alors qu'une méconnaissance profonde de la culture peut durablement isoler une personne pourtant bilingue."],"nuances":["Certes, la langue est fondamentale, mais elle et la culture sont indissociables, si bien qu'il est artificiel de vouloir les hiérarchiser.","L'importance relative de chacune dépend du contexte : un commerçant a surtout besoin de la langue, tandis qu'un diplomate doit avant tout maîtriser les subtilités culturelles.","On peut soutenir que la langue ouvre la porte, mais que c'est la culture qui permet de vraiment habiter la maison, de sorte que les deux sont nécessaires à des étapes différentes."]},{"subject":"« Les gouvernements devraient faciliter l'accueil des réfugiés. Qu'en pensez-vous ? »","pour":["Accueillir les réfugiés relève d'un devoir humanitaire fondamental envers des personnes qui fuient la guerre, la persécution ou des catastrophes.","La plupart des conventions internationales engagent les États à protéger ceux dont la vie est menacée, et les respecter renforce la crédibilité d'un pays.","Bien intégrés, les réfugiés contribuent à l'économie et à la société, comme l'ont montré de nombreux exemples historiques de populations exilées devenues prospères.","Faciliter un accueil ordonné et légal réduit les filières clandestines et les drames humains qui se jouent aux frontières.","Un accueil digne reflète les valeurs de solidarité et d'humanité dont une société peut être fière, et qu'elle souhaite transmettre aux générations futures."],"contre":["Un accueil sans moyens suffisants risque de placer les réfugiés dans des conditions précaires, ce qui dessert autant les arrivants que le pays.","Certains craignent que des procédures trop souples ne soient détournées par des personnes qui ne relèvent pas réellement de l'asile.","Les capacités d'accueil ne sont pas illimitées, et un pays doit aussi tenir compte de ses propres difficultés sociales et économiques.","Une mauvaise gestion de l'accueil peut nourrir les tensions et renforcer les discours hostiles, au détriment des réfugiés eux-mêmes.","La question devrait selon certains être traitée à l'échelle internationale, par un partage équitable, plutôt que reposer sur quelques pays."],"nuances":["Certes, le devoir d'accueil est indéniable, mais il doit s'accompagner de moyens réels d'intégration pour ne pas se réduire à une promesse vide.","Faciliter l'accueil ne signifie pas renoncer à tout contrôle, car concilier générosité et rigueur dans l'examen des demandes est parfaitement possible.","Le véritable enjeu n'est pas seulement d'ouvrir les portes, mais de répartir l'effort de façon solidaire entre les nations pour qu'il soit soutenable."]},{"subject":"« Aujourd'hui, grâce à la mondialisation, vivre à l'étranger est devenu plus facile qu'autrefois. Êtes-vous d'accord ? »","pour":["Les technologies de communication permettent de rester en contact quotidien avec ses proches, ce qui réduit considérablement le sentiment d'isolement.","Internet donne accès à une mine d'informations pratiques sur le logement, les démarches ou la culture, bien avant même le départ.","Les transports modernes rendent les voyages rapides et abordables, si bien qu'un retour au pays n'est plus l'expédition coûteuse qu'il était jadis.","La standardisation de certains services et la présence d'enseignes internationales offrent des repères familiers où que l'on s'installe.","L'anglais s'est imposé comme langue véhiculaire dans de nombreux domaines, ce qui facilite les premiers échanges en attendant de maîtriser la langue locale."],"contre":["La mondialisation a multiplié les déplacements, mais les démarches administratives et les contrôles migratoires se sont au contraire durcis dans bien des pays.","La facilité technologique crée parfois l'illusion d'un monde uniforme, alors que les différences culturelles profondes restent aussi déroutantes qu'avant.","La concurrence accrue sur le marché du travail mondial rend l'obtention d'un emploi à l'étranger plus difficile dans certains secteurs.","Rester connecté en permanence à son pays d'origine peut paradoxalement freiner l'intégration, en empêchant de vraiment s'ancrer dans le nouvel environnement.","Le coût de la vie a fortement augmenté dans de nombreuses métropoles attractives, ce qui complique l'installation des nouveaux arrivants."],"nuances":["Certes, les aspects matériels et logistiques se sont nettement simplifiés, mais les difficultés humaines comme la solitude ou le mal du pays demeurent intactes.","La facilité dépend largement du profil : un cadre qualifié bénéficie pleinement de la mondialisation, alors qu'un travailleur précaire en subit surtout la dureté.","On peut dire que vivre à l'étranger est devenu techniquement plus simple, mais pas nécessairement plus facile sur le plan émotionnel et identitaire."]},{"subject":"« Les enfants d'immigrants s'intègrent toujours mieux que leurs parents. Êtes-vous d'accord ? »","pour":["Scolarisés dans le pays d'accueil, les enfants apprennent la langue locale sans accent et l'utilisent naturellement, ce qui leur confère un avantage décisif.","À l'école, ils nouent dès le plus jeune âge des amitiés avec les enfants du pays, ce qui les immerge pleinement dans la culture locale.","Leur jeune âge leur donne une grande souplesse d'adaptation, là où leurs parents ont déjà des habitudes profondément ancrées.","Grandissant entre deux cultures, ils en maîtrisent les codes et passent aisément de l'une à l'autre selon les situations.","Ils n'ont pas connu le déracinement de la même manière que leurs parents, car le pays d'accueil est souvent le seul qu'ils aient vraiment connu."],"contre":["Certains enfants d'immigrants souffrent d'un conflit de loyauté entre la culture de leurs parents et celle du pays d'accueil, ce qui complique leur construction identitaire.","La discrimination ne disparaît pas forcément avec la deuxième génération, et certains se sentent rejetés malgré une intégration apparente.","Beaucoup de parents s'intègrent remarquablement bien grâce à leur travail et à leur détermination, tandis que certains enfants peinent à trouver leur place.","Le sentiment de ne se sentir pleinement chez soi nulle part peut engendrer chez certains jeunes un mal-être plus profond que celui de leurs parents.","L'intégration dépend des conditions concrètes de vie, comme le quartier ou l'école, bien plus que de la simple appartenance à une génération."],"nuances":["Certes, les enfants maîtrisent mieux la langue, mais une intégration réussie ne se mesure pas qu'à cela : elle touche aussi au sentiment d'appartenance et à l'acceptation par les autres.","La réalité varie énormément selon les familles et les pays, de sorte qu'aucune règle générale ne peut s'appliquer à tous les cas.","On peut nuancer en distinguant l'intégration sociale, souvent plus aisée pour les enfants, de l'équilibre identitaire, qui peut au contraire leur poser davantage de difficultés."]},{"subject":"« Partir vivre à l'étranger pour améliorer sa situation économique est un bon choix. Qu'en pensez-vous ? »","pour":["De meilleurs salaires et de meilleures conditions de travail à l'étranger permettent souvent d'offrir un avenir plus sûr à toute sa famille.","Certains pays proposent des opportunités professionnelles inexistantes dans le pays d'origine, ce qui justifie pleinement le départ.","Les revenus envoyés au pays par les migrants aident concrètement leurs proches restés sur place et soutiennent l'économie locale.","Travailler à l'étranger permet d'acquérir des compétences et une expérience précieuses, qui valorisent un parcours professionnel pour toute la vie.","Améliorer sa situation matérielle ouvre l'accès à de meilleurs soins, à une bonne éducation pour ses enfants et à une vie plus digne."],"contre":["Le gain financier se paie souvent au prix de la séparation d'avec la famille et les amis, un sacrifice affectif que l'argent ne compense pas toujours.","Le coût de la vie plus élevé dans le pays d'accueil peut réduire à néant l'avantage salarial que l'on espérait initialement.","Beaucoup d'immigrants se retrouvent dans des emplois précaires et mal considérés, loin des promesses qui les avaient attirés.","L'argent ne fait pas le bonheur, et certains migrants, bien que plus aisés, souffrent profondément de solitude et de déracinement.","Quitter son pays pour des raisons purement économiques peut conduire à négliger d'autres dimensions essentielles, comme l'attachement à sa terre et à ses proches."],"nuances":["Certes, l'amélioration économique est un motif légitime, mais elle ne devrait pas être le seul critère, car la qualité de vie ne se résume pas aux revenus.","Le bien-fondé du choix dépend de chaque situation : fuir la misère n'a pas la même portée que partir par simple ambition de gagner davantage.","On peut soutenir que le départ est un bon choix à condition qu'il soit mûrement réfléchi, en pesant honnêtement les gains matériels face aux coûts humains."]}]},{"theme":"Travail, emploi & carrière","subjects":[{"subject":"« Le stress au travail est stimulant. Qu'en pensez-vous ? »","pour":["Une dose raisonnable de stress mobilise notre énergie et notre concentration, ce qui nous aide à respecter les délais et à rendre un travail soigné.","La pression d'un projet important pousse à se dépasser et à découvrir des capacités qu'on ne soupçonnait pas, par exemple parler en public devant une grande assemblée.","Le stress signale que ce qu'on fait compte vraiment : sans enjeu, beaucoup de gens s'ennuieraient et perdraient toute motivation.","Affronter régulièrement des situations tendues développe la résistance et la confiance en soi, des qualités précieuses pour évoluer dans sa carrière.","Dans certains métiers comme l'urgence médicale ou le journalisme, c'est justement l'adrénaline qui rend le travail passionnant et attire les candidats."],"contre":["Le stress chronique épuise l'organisme et conduit souvent au burn-out, un état d'épuisement qui peut éloigner du travail pendant des mois.","Sous pression constante, on commet davantage d'erreurs car la peur de mal faire brouille le jugement et empêche de réfléchir clairement.","Le stress dégrade la santé : troubles du sommeil, maux de tête, hypertension et anxiété finissent par toucher même les plus solides.","Il empoisonne aussi la vie privée, parce qu'on rentre chez soi tendu et incapable de profiter de sa famille ou de ses loisirs.","Ce qui stimule réellement, c'est l'intérêt de la tâche et la reconnaissance, pas la menace permanente d'une sanction ou d'un échec."],"nuances":["Certes, une pointe de stress avant une échéance peut donner un coup de fouet, mais ce bénéfice disparaît dès que la pression devient permanente.","Tout dépend du tempérament de chacun : ce qui dynamise une personne combative peut paralyser quelqu'un de plus sensible.","La frontière entre stress motivant et stress destructeur est ténue, et c'est souvent au manager qu'il revient de la surveiller pour préserver son équipe."]},{"subject":"« Il est facile de partir travailler à l'étranger. Êtes-vous d'accord ? »","pour":["La mondialisation a multiplié les offres d'emploi internationales, et de nombreuses entreprises recrutent directement des talents par-delà les frontières.","Internet permet de postuler à distance, de passer des entretiens en visioconférence et de comparer les conditions de vie d'un pays avant même de partir.","Certains accords entre États, comme la libre circulation au sein de l'Union européenne, suppriment les démarches de visa et simplifient l'installation.","L'anglais s'est imposé comme langue commune dans beaucoup de secteurs, ce qui rend l'intégration professionnelle plus accessible qu'autrefois.","Des programmes d'échange, de stage ou de mobilité étudiante préparent les jeunes très tôt à l'expatriation et leur ouvrent un réseau à l'international."],"contre":["Les démarches administratives restent un parcours du combattant : permis de travail, visas et équivalences de diplômes peuvent prendre des mois.","La barrière de la langue handicape lourdement ceux qui ne maîtrisent pas l'idiome local, surtout pour les métiers en contact avec le public.","S'éloigner de sa famille et de ses amis provoque un mal du pays qui pousse beaucoup d'expatriés à renoncer et à rentrer chez eux.","Le coût d'un déménagement à l'étranger, du logement aux premiers mois sans revenu stable, dissuade ceux qui n'ont pas d'économies.","Certains diplômes ne sont pas reconnus ailleurs, si bien qu'un professionnel qualifié peut se retrouver contraint d'accepter un poste sous-payé."],"nuances":["Certes, partir est plus simple pour un ingénieur très demandé, mais cela reste un défi considérable pour un travailleur peu qualifié ou âgé.","La facilité dépend énormément du pays visé : émigrer au Canada n'a rien à voir avec une installation dans un État aux frontières fermées.","Même quand les démarches sont fluides, la véritable difficulté est moins de partir que de s'intégrer durablement dans une culture différente."]},{"subject":"« Il faut éviter de travailler avec un membre de sa famille. Êtes-vous d'accord ? »","pour":["Mêler liens familiaux et relations professionnelles risque de transformer le moindre désaccord de bureau en conflit qui empoisonne aussi les repas de famille.","Il devient très difficile de critiquer le travail d'un proche ou de le sanctionner, ce qui nuit à l'efficacité et à l'équité de l'entreprise.","Les autres salariés peuvent soupçonner du favoritisme, ce qui crée un malaise et démotive ceux qui ne portent pas le même nom de famille.","On peine à séparer vie privée et vie professionnelle, et l'on finit par parler boulot lors de chaque réunion familiale, sans jamais déconnecter.","En cas d'échec de l'entreprise, c'est à la fois le patrimoine et l'harmonie de la famille qui s'effondrent, un double risque difficile à assumer."],"contre":["La confiance entre proches est un atout rare dans le monde du travail, car on sait pouvoir compter sur la loyauté d'un membre de sa famille.","De nombreuses entreprises familiales prospèrent depuis des générations, preuve qu'une bonne communication permet de concilier sang et affaires.","Travailler ensemble permet de transmettre un savoir-faire et des valeurs, et de bâtir un projet commun qui renforce les liens plutôt que de les briser.","Un proche connaît nos forces et nos faiblesses, ce qui facilite la répartition des tâches et une collaboration plus naturelle.","En période difficile, un associé de la famille acceptera plus volontiers des sacrifices, comme différer son salaire, qu'un partenaire extérieur."],"nuances":["Certes, la confiance familiale est précieuse, mais elle ne remplace pas des règles claires et un partage écrit des responsabilités.","Tout dépend de la qualité de la relation : une famille soudée et mûre y parviendra là où une famille conflictuelle court à la catastrophe.","L'idéal n'est peut-être pas d'éviter tout lien familial, mais de fixer dès le départ des frontières strictes entre le foyer et l'entreprise."]},{"subject":"« Le télétravail est plus avantageux que le travail au bureau. Êtes-vous d'accord ? »","pour":["Travailler depuis chez soi supprime les longs trajets quotidiens, ce qui fait gagner un temps précieux et réduit la fatigue comme la pollution.","À domicile, on échappe aux interruptions incessantes de l'open space et l'on peut se concentrer plus profondément sur les tâches exigeantes.","Le télétravail offre une vraie souplesse d'horaires, permettant par exemple d'aller chercher ses enfants à l'école sans poser une journée de congé.","Il élargit le bassin d'emploi : un salarié peut travailler pour une entreprise située à l'autre bout du pays sans déménager.","Beaucoup de personnes se disent plus productives et moins stressées chez elles, dans un environnement qu'elles aménagent à leur goût."],"contre":["L'isolement guette le télétravailleur, qui perd les échanges spontanés autour de la machine à café, sources d'idées et de cohésion d'équipe.","La frontière entre vie privée et travail s'efface, et l'on finit par répondre à ses courriels tard le soir, sans jamais vraiment décrocher.","Tout le monde ne dispose pas chez soi d'un espace calme et bien équipé, surtout dans un petit logement partagé avec famille ou colocataires.","La collaboration à distance complique la créativité collective, car un écran ne remplace pas la richesse d'un échange en personne.","Pour les nouveaux venus, l'absence de présence physique freine l'apprentissage et l'intégration dans la culture de l'entreprise."],"nuances":["Certes, le télétravail apporte de la liberté, mais cette liberté exige une grande discipline personnelle que tout le monde ne possède pas.","La formule idéale est sans doute hybride, alternant journées à domicile pour se concentrer et jours au bureau pour entretenir le collectif.","Les avantages varient selon les métiers : une développeuse en profite pleinement, alors qu'un soignant ou un ouvrier en sont totalement exclus."]},{"subject":"« Le salaire est le critère le plus important dans le choix d'un emploi. Qu'en pensez-vous ? »","pour":["Un bon salaire garantit la sécurité matérielle : se loger, se nourrir et faire face aux imprévus sans angoisse permanente pour ses finances.","La rémunération reflète souvent la reconnaissance de l'employeur, et se sentir bien payé renforce le sentiment d'être valorisé à sa juste valeur.","Un revenu confortable ouvre des possibilités hors travail : voyager, se cultiver, soutenir sa famille ou préparer sereinement sa retraite.","Dans un contexte d'inflation et de loyers élevés, beaucoup n'ont pas le luxe de choisir, et le montant du chèque devient une priorité vitale.","Un salaire élevé offre aussi une liberté de manœuvre, comme refuser des heures supplémentaires ou quitter un poste devenu insatisfaisant."],"contre":["Un salaire élevé ne compense jamais un travail qui n'a aucun sens : beaucoup de cadres bien payés démissionnent par lassitude profonde.","L'ambiance d'équipe et la qualité des relations pèsent énormément, car on passe une grande partie de sa vie aux côtés de ses collègues.","Les perspectives d'évolution et d'apprentissage comptent davantage à long terme qu'un bon salaire de départ dans un poste sans avenir.","L'équilibre entre vie professionnelle et vie privée est devenu primordial, et aucune somme ne rachète des soirées et week-ends sacrifiés.","Un métier en accord avec ses valeurs procure une satisfaction profonde que l'argent seul est incapable de fournir."],"nuances":["Certes, l'argent ne fait pas le bonheur, mais un salaire insuffisant génère un stress qui finit par gâcher l'intérêt même du travail.","La hiérarchie des critères évolue avec l'âge : un jeune diplômé endetté ne raisonne pas comme un employé établi qui cherche du sens.","L'idéal n'est pas d'opposer salaire et épanouissement, mais de trouver un poste qui offre une rémunération décente sans renoncer à l'essentiel."]},{"subject":"« Changer souvent d'emploi est un signe de réussite professionnelle. Êtes-vous d'accord ? »","pour":["Multiplier les expériences permet d'acquérir des compétences variées et de devenir un profil polyvalent, très recherché sur le marché actuel.","Changer de poste est souvent le moyen le plus rapide d'obtenir une augmentation ou une promotion, plus efficace qu'attendre une revalorisation interne.","Quitter régulièrement une entreprise prouve qu'on est capable de rebondir et qu'on reste attractif aux yeux des recruteurs.","La mobilité élargit considérablement le réseau professionnel, un atout décisif pour saisir de futures opportunités.","Oser partir vers de nouveaux défis témoigne d'ambition et d'une volonté de progresser plutôt que de s'installer dans le confort de la routine."],"contre":["Un parcours trop morcelé inquiète les recruteurs, qui peuvent y voir de l'instabilité ou une incapacité à s'engager durablement.","Rester longtemps dans une entreprise permet de gravir les échelons, de gagner la confiance de sa hiérarchie et d'accéder à des responsabilités élevées.","La fidélité offre une expertise approfondie d'un secteur, là où le papillonnage maintient toujours dans une connaissance superficielle.","Recommencer sans cesse à zéro coûte de l'énergie, car il faut chaque fois réapprendre les codes et se faire une nouvelle place.","La réussite se mesure aussi à la construction d'un projet sur la durée, à l'image de ces dirigeants qui ont bâti une carrière dans la même maison."],"nuances":["Certes, la mobilité enrichit le parcours, mais un changement tous les six mois traduit plutôt une fuite qu'une stratégie de carrière réfléchie.","Le sens d'un changement dépend de la raison : partir pour un meilleur poste n'a rien à voir avec partir parce qu'on ne tient nulle part.","Les attentes varient selon les secteurs : la rotation est valorisée dans la tech, alors que la stabilité reste un gage de sérieux ailleurs."]},{"subject":"« Il vaut mieux suivre sa passion que choisir un métier qui rapporte. Qu'en pensez-vous ? »","pour":["Exercer un métier qui nous passionne donne l'énergie de se lever chaque matin et transforme les heures de travail en véritable plaisir.","La passion nourrit l'excellence : on se forme sans effort et l'on devient souvent meilleur que ceux qui n'agissent que par calcul financier.","Le regret de ne pas avoir tenté ce qui nous tenait à cœur pèse parfois toute une vie, alors que l'argent gagné s'oublie vite.","Un travail aligné avec sa vocation préserve la santé mentale et limite le risque de dépression lié à un emploi vécu comme une prison.","Beaucoup de réussites entrepreneuriales sont nées d'une passion poursuivie envers et contre tout, bien avant d'être rentables."],"contre":["Toutes les passions ne nourrissent pas leur homme, et vivre de son art ou du sport relève parfois d'un pari extrêmement risqué.","Transformer un loisir en métier peut tuer le plaisir, car les contraintes et la pression finissent par gâcher ce qu'on aimait.","Sans revenu suffisant, même la plus belle vocation devient un fardeau dès qu'il faut payer son loyer et nourrir sa famille.","Un métier alimentaire stable laisse justement le temps et les moyens de cultiver sa passion librement, le soir ou le week-end.","Le marché ne demande pas forcément ce qui nous passionne, et s'entêter peut conduire à des années de précarité et de frustration."],"nuances":["Certes, suivre sa passion est séduisant, mais cela suppose un filet de sécurité que tout le monde ne possède pas.","L'idéal serait de trouver un terrain d'entente, un métier suffisamment proche de ses centres d'intérêt pour rester motivant et nourricier.","La sagesse consiste peut-être à conjuguer les deux dans le temps : assurer d'abord sa stabilité, puis se tourner vers sa vocation."]},{"subject":"« Les nouvelles technologies détruisent plus d'emplois qu'elles n'en créent. Êtes-vous d'accord ? »","pour":["L'automatisation et les robots remplacent déjà des milliers de postes en usine, dans la logistique ou aux caisses des supermarchés.","L'intelligence artificielle s'attaque désormais à des métiers qualifiés, comme la traduction ou la rédaction, longtemps jugés à l'abri.","Les emplois créés par la technologie exigent souvent des compétences pointues que les travailleurs licenciés n'ont pas le temps d'acquérir.","La transition se fait à un rythme brutal, ne laissant pas aux salariés peu qualifiés la possibilité de se reconvertir à temps.","Les gains de productivité profitent surtout aux actionnaires des grandes entreprises, pas aux ouvriers dont le poste a disparu."],"contre":["Chaque révolution technique, de l'imprimerie à l'ordinateur, a finalement créé plus d'emplois qu'elle n'en a supprimés, en ouvrant des secteurs inédits.","Le numérique a fait naître des métiers entiers, du développement d'applications à la cybersécurité, inimaginables il y a quelques décennies.","La technologie libère les humains des tâches pénibles ou répétitives pour les recentrer sur des missions plus créatives et valorisantes.","Elle améliore la productivité, ce qui permet aux entreprises de croître et, à terme, d'embaucher davantage.","De nouveaux besoins de maintenance, de formation et d'accompagnement émergent autour de chaque innovation, générant de l'emploi."],"nuances":["Certes, l'histoire montre un solde positif à long terme, mais cela ne console pas les générations sacrifiées pendant la transition.","Le bilan dépend surtout de l'accompagnement public : sans formation ni protection sociale, la destruction l'emporte sur la création.","Le vrai enjeu n'est peut-être pas le nombre d'emplois, mais leur qualité et leur répartition équitable entre les territoires."]},{"subject":"« Un bon dirigeant doit avant tout être proche de ses employés. Qu'en pensez-vous ? »","pour":["Un dirigeant accessible inspire la confiance, et des salariés qui se sentent écoutés s'investissent davantage dans leur travail.","La proximité permet de repérer rapidement les tensions ou les difficultés sur le terrain, avant qu'elles ne dégénèrent en crise.","Connaître les réalités quotidiennes de ses équipes aide à prendre des décisions justes et adaptées plutôt que déconnectées du concret.","Un chef chaleureux fidélise ses collaborateurs, qui hésiteront à quitter une entreprise où ils se sentent respectés en tant que personnes.","La proximité favorise une circulation libre de l'information et des idées, source d'innovation et de réactivité face aux imprévus."],"contre":["Trop de proximité peut brouiller l'autorité et rendre difficiles les décisions impopulaires, comme un licenciement ou un recadrage.","Le rôle premier d'un dirigeant est d'avoir une vision stratégique claire, et l'excès de relationnel risque de le détourner de cet essentiel.","La familiarité ouvre la porte au favoritisme et aux jalousies, qui minent l'équité et la cohésion d'une équipe.","Certains employés préfèrent un cadre professionnel net et distant, où l'on n'empiète pas sur leur vie privée.","Un bon leader se juge surtout à sa compétence et à sa capacité à faire prospérer l'entreprise, pas à sa convivialité."],"nuances":["Certes, la proximité humanise le management, mais elle doit s'accompagner d'un respect clair de la hiérarchie pour rester efficace.","Le bon équilibre dépend de la taille de la structure : la proximité naturelle d'une petite équipe devient un défi dans un grand groupe.","L'essentiel n'est peut-être pas d'être proche, mais d'être juste et cohérent, qualités qu'un dirigeant respecté peut incarner à distance."]},{"subject":"« La retraite à un âge avancé est une bonne chose pour la société. Êtes-vous d'accord ? »","pour":["Allonger la durée de travail aide à financer les régimes de retraite, mis sous pression par le vieillissement de la population.","Les seniors possèdent une expérience et une mémoire de l'entreprise précieuses qu'il serait dommage de perdre trop tôt.","Avec l'allongement de l'espérance de vie en bonne santé, beaucoup de personnes se sentent capables et désireuses de travailler plus longtemps.","Rester actif maintient un lien social et un sentiment d'utilité qui préservent la santé physique et morale des plus âgés.","Repousser le départ permet de garder des compétences rares sur le marché, dans des métiers où la relève manque cruellement."],"contre":["Tous les métiers ne se valent pas : un ouvrier du bâtiment use son corps bien plus vite qu'un employé de bureau et mérite de s'arrêter plus tôt.","Maintenir les seniors en poste peut freiner l'embauche des jeunes, qui peinent déjà à trouver leur première place sur le marché.","Travailler jusqu'à un âge avancé prive de précieuses années de liberté, alors qu'on a déjà donné des décennies de sa vie au travail.","La fatigue et les problèmes de santé augmentent avec l'âge, ce qui réduit la productivité et multiplie les arrêts maladie.","Beaucoup d'employeurs rechignent à garder ou recruter des salariés âgés, qui se retrouvent au chômage sans pouvoir encore prétendre à la retraite."],"nuances":["Certes, l'équilibre financier des retraites est réel, mais on peut le résoudre autrement qu'en imposant le même âge à tous les métiers.","La solution juste passe sans doute par la pénibilité : adapter l'âge de départ selon la dureté réelle de chaque profession.","Le débat oppose moins les âges que les générations, et il faudrait l'aborder en cherchant un partage du travail plutôt qu'un affrontement."]}]},{"theme":"Éducation, école & études","subjects":[{"subject":"« Étudier à l'étranger est un atout indispensable de nos jours. Êtes-vous d'accord ? »","pour":["Une expérience internationale développe l'autonomie, car l'étudiant doit gérer seul son logement, ses démarches administratives et son budget loin de sa famille.","La maîtrise d'une langue étrangère progresse beaucoup plus vite par l'immersion totale que par des cours suivis dans son pays d'origine.","Les recruteurs valorisent souvent un parcours à l'étranger, qu'ils interprètent comme un signe d'adaptabilité et d'ouverture d'esprit.","Le contact quotidien avec une autre culture aide à relativiser ses propres habitudes et à mieux comprendre les enjeux d'un monde globalisé.","Certaines universités étrangères offrent des spécialisations ou des équipements de recherche qui n'existent tout simplement pas dans le pays d'origine."],"contre":["Le coût d'un séjour à l'étranger, entre les frais de scolarité élevés et le logement, reste hors de portée pour de nombreuses familles modestes.","Beaucoup d'employeurs recrutent avant tout sur les compétences techniques et l'expérience professionnelle, sans accorder un poids déterminant à la mobilité.","L'éloignement peut entraîner un isolement et un mal du pays qui nuisent à la réussite des études plutôt qu'ils ne la favorisent.","De nombreuses formations nationales sont d'excellente qualité et permettent d'accéder aux mêmes débouchés sans s'expatrier.","Présenter la mobilité comme « indispensable » dévalorise injustement tous ceux qui réussissent brillamment en restant dans leur pays."],"nuances":["Certes, un séjour à l'étranger enrichit un parcours, mais il n'a de valeur réelle que s'il est bien préparé et relié à un véritable projet professionnel.","L'expérience internationale est un atout précieux, pourtant des alternatives moins coûteuses, comme les universités d'été ou les cours en ligne avec des partenaires étrangers, peuvent offrir des bénéfices comparables.","Tout dépend du domaine visé : indispensable pour les métiers du commerce international ou de la diplomatie, la mobilité reste secondaire pour bien d'autres professions ancrées localement."]},{"subject":"« Les notes à l'école sont-elles vraiment utiles ? »","pour":["Les notes fournissent un repère clair qui permet à l'élève de situer son niveau et de mesurer ses progrès au fil de l'année.","Elles incitent à travailler avec régularité, car la perspective d'une évaluation chiffrée motive de nombreux élèves à réviser sérieusement.","Un système de notation commun facilite la sélection équitable lors de l'entrée dans les filières sélectives ou les concours.","Les notes aident les enseignants à repérer rapidement les difficultés et à adapter leur accompagnement aux élèves en retard.","Elles offrent aux parents un indicateur concret pour suivre la scolarité de leur enfant et dialoguer avec l'école."],"contre":["La note réduit un travail riche à un simple chiffre, sans expliquer ce que l'élève a réellement compris ou ce qu'il doit améliorer.","La pression des notes engendre un stress important, voire un dégoût de l'apprentissage, certains élèves travaillant pour la note plutôt que par curiosité.","La notation reste souvent subjective, un même devoir pouvant recevoir des appréciations très différentes selon le correcteur.","Les notes accentuent la comparaison et la compétition entre camarades, au détriment de la coopération et de l'entraide.","Un élève fragile peut se décourager durablement après une série de mauvaises notes, ce qui aggrave son retard au lieu de le combler."],"nuances":["Certes, les notes sont imparfaites, mais les supprimer sans les remplacer par un autre repère fiable priverait élèves et familles de tout point de comparaison.","Le problème tient moins à la note elle-même qu'à l'usage qu'on en fait : associée à des commentaires détaillés, elle devient un outil de progrès plutôt qu'un verdict.","Une évaluation par compétences ou par couleurs peut compléter utilement la note, à condition de rester lisible pour les élèves comme pour les parents."]},{"subject":"« Les téléphones portables devraient être interdits dans les écoles. Qu'en pensez-vous ? »","pour":["Le téléphone détourne sans cesse l'attention des élèves, qui consultent leurs messages ou les réseaux sociaux au lieu de suivre le cours.","Son interdiction réduit le harcèlement en ligne et la diffusion de photos ou de vidéos prises à l'insu des camarades.","Sans écran, les élèves se parlent davantage pendant les récréations et retrouvent des interactions sociales plus directes.","L'absence de téléphone limite la tricherie pendant les examens, où il sert facilement à chercher des réponses.","Couper l'accès permanent aux notifications aide les jeunes à se concentrer et à développer leur capacité d'attention sur la durée."],"contre":["Le téléphone est aussi un outil pédagogique puissant, qui permet de consulter un dictionnaire, de faire des recherches ou d'utiliser des applications éducatives.","Une interdiction totale est difficile à appliquer et pousse les élèves à le cacher, ce qui crée un climat de surveillance peu sain.","Apprendre à utiliser son téléphone de manière responsable est plus formateur qu'une interdiction qui repousse simplement le problème à plus tard.","En cas d'urgence, le téléphone permet à l'élève de joindre rapidement sa famille ou les secours.","Beaucoup d'établissements organisent désormais des activités scolaires sur smartphone, qu'une interdiction stricte rendrait impossibles."],"nuances":["Certes, le téléphone nuit à la concentration, mais une interdiction pendant les cours assortie d'une tolérance aux récréations offre un compromis raisonnable.","Plutôt qu'une interdiction uniforme, on peut autoriser le téléphone pour des usages encadrés par l'enseignant et l'interdire le reste du temps.","L'enjeu dépend de l'âge : justifiée à l'école primaire, l'interdiction stricte semble moins adaptée à des lycéens qu'il faut préparer à un usage autonome."]},{"subject":"« Apprendre une deuxième langue dès le plus jeune âge est essentiel. Êtes-vous d'accord ? »","pour":["Le cerveau d'un jeune enfant assimile naturellement les sons et la grammaire d'une langue, ce qui lui assure une prononciation plus authentique.","Le bilinguisme précoce développe la souplesse mentale et facilite, plus tard, l'apprentissage d'autres langues.","Maîtriser tôt une langue étrangère ouvre l'accès à d'autres cultures et favorise l'ouverture d'esprit dès l'enfance.","Dans un marché du travail mondialisé, les compétences linguistiques acquises jeune représentent un avantage durable.","Apprendre une langue en jouant, par des chansons et des histoires, rend l'expérience agréable et sans la pression des examens."],"contre":["Multiplier les apprentissages trop tôt peut surcharger l'enfant, surtout s'il maîtrise encore mal sa langue maternelle.","Sans pratique régulière, les acquis précoces se perdent rapidement et l'effort initial devient vain.","Des adolescents et des adultes motivés atteignent un excellent niveau, ce qui prouve qu'il n'est jamais trop tard pour apprendre.","La qualité de l'enseignement compte plus que l'âge : un cours mal conçu donne de piètres résultats même chez les plus jeunes.","Toutes les familles n'ont pas accès aux écoles bilingues ou aux ressources nécessaires, ce qui crée des inégalités dès le départ."],"nuances":["Certes, la précocité aide pour l'accent, mais la motivation et la régularité pèsent finalement davantage que l'âge de départ.","L'apprentissage précoce est bénéfique à condition qu'il reste ludique et qu'il ne se fasse pas au détriment de la langue maternelle.","Plutôt qu'« essentiel », on pourrait d
