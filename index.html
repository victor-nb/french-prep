 que l'école l'accompagne par une véritable éducation au respect, à l'écoute et au dialogue entre les élèves.","En conclusion, je pense que la diversité sociale et culturelle à l'école favorise bel et bien l'esprit de tolérance, car elle habitue les élèves à la différence et leur apprend à vivre ensemble. Encore faut-il que cette richesse soit valorisée et encadrée. À cette condition, l'école devient l'un des meilleurs remparts contre les préjugés."]},{"rank":199,"frequency":1,"subject":"Partir vivre à l'étranger avec ses proches est-ce moins difficile que de s'y rendre seul ?","themes":["Immigration / vivre à l'étranger / intégration","Famille / amitié / relations / célibat","Lecture / livres / culture / art"],"audio":"src/production-orale/tache3/examples/audio/199-partir-vivre-l-etranger-proches-difficile-s.mp3","answer":["L'expatriation est une aventure qui attire de plus en plus de monde, mais elle soulève une vraie question : vaut-il mieux la vivre entouré des siens ou se lancer seul ? Personnellement, je pense que partir accompagné de ses proches rend l'expérience nettement moins difficile. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, la présence de la famille offre un soutien affectif précieux dans les moments de doute. En effet, les premières semaines à l'étranger sont souvent marquées par le mal du pays, la fatigue administrative et un sentiment d'isolement. Avoir quelqu'un à ses côtés permet de partager ces difficultés au lieu de les porter seul. Par exemple, après une longue journée passée à se battre avec une langue qu'on ne maîtrise pas encore, rentrer dans un foyer où l'on peut parler sa langue maternelle et se confier à un être cher change tout : on récupère de l'énergie au lieu de ruminer ses problèmes.","Ensuite, partir à plusieurs facilite l'organisation pratique et le partage des responsabilités. Cela permet de répartir les tâches : pendant que l'un cherche un logement, l'autre s'occupe des papiers ou des enfants. C'est notamment le cas des couples qui s'installent ensemble dans un nouveau pays et qui avancent beaucoup plus vite parce qu'ils se relaient. À deux ou à plusieurs, on garde aussi un repère stable, une sorte de petit cocon familier qui rassure quand tout le reste est inconnu.","Cependant, certaines personnes pensent que partir seul est plus formateur, car cela force à se débrouiller, à aller vers les autres et à gagner en autonomie. Je comprends ce point de vue, et il n'est pas faux : la solitude pousse parfois à sortir de sa coquille. Mais je crois que cet apprentissage se fait au prix d'une grande solitude, qui peut décourager et même provoquer un retour prématuré. La compagnie des proches n'empêche pas de s'ouvrir au pays d'accueil ; elle offre simplement une base solide à partir de laquelle on ose explorer.","En conclusion, je pense que partir vivre à l'étranger avec ses proches est bel et bien moins difficile que de s'y rendre seul, car le soutien moral, le partage des tâches et le sentiment de sécurité réduisent énormément le stress de l'adaptation. On pourrait même dire que l'aventure devient alors une expérience à savourer plutôt qu'une épreuve à endurer."]},{"rank":200,"frequency":1,"subject":"Est-il nécessaire que les organisations fournissent des opportunités d'apprentissage régulières ?","themes":["Éducation / école / études / diplômes"],"audio":"src/production-orale/tache3/examples/audio/200-necessaire-organisations-fournissent-opportunites-d-apprentissage-regulieres.mp3","answer":["À l'heure où les métiers évoluent à une vitesse vertigineuse, la question de la formation continue en entreprise est plus que jamais d'actualité. Pour ma part, j'estime qu'il est non seulement utile mais véritablement nécessaire que les organisations offrent à leurs employés des occasions régulières d'apprendre. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, la formation continue est indispensable pour rester compétitif dans un monde en perpétuel changement. En effet, les technologies, les outils et les méthodes de travail se renouvellent sans cesse, et un savoir acquis il y a dix ans peut être totalement dépassé aujourd'hui. Par exemple, dans le secteur informatique, un développeur qui ne se forme jamais aux nouveaux langages ou à l'intelligence artificielle risque de voir ses compétences devenir obsolètes en quelques années à peine. Il en va de même dans la santé, la finance ou l'industrie, où les réglementations et les machines évoluent constamment. L'entreprise qui investit dans la formation protège donc à la fois ses salariés, qui restent employables, et sa propre survie face à la concurrence.","Ensuite, offrir des occasions d'apprendre renforce la motivation et la fidélité des employés. Cela permet de montrer que l'organisation croit en ses équipes et souhaite les faire grandir, ce qui crée un véritable sentiment d'appartenance. C'est notamment le cas des entreprises qui financent des certifications ou des cours de langue : leurs salariés se sentent valorisés et hésitent davantage à partir voir ailleurs. Un personnel qui apprend est aussi un personnel plus polyvalent, capable de s'adapter aux imprévus et d'occuper de nouvelles fonctions sans qu'il faille recruter à l'extérieur. À l'inverse, une équipe à qui l'on ne propose jamais rien finit par se démotiver et stagner.","Cependant, certaines personnes pensent que la formation représente un coût important et une perte de temps de production pour l'entreprise. Je comprends ce point de vue, car former coûte de l'argent et mobilise des heures qui ne sont pas consacrées au travail immédiat. Mais je crois qu'il s'agit d'un investissement et non d'une dépense : un employé mieux formé est plus efficace, commet moins d'erreurs et apporte plus de valeur sur le long terme. Ne pas former, c'est au contraire prendre le risque de voir ses compétences vieillir et de prendre du retard sur ses concurrents, ce qui coûte finalement bien plus cher.","En conclusion, je pense qu'il est nécessaire que les organisations fournissent des opportunités d'apprentissage régulières, car cela maintient la compétitivité, motive les équipes et prépare l'entreprise aux défis de demain. Finalement, je dirais qu'une organisation qui cesse d'apprendre est une organisation qui commence à décliner."]},{"rank":201,"frequency":1,"subject":"Le principal facteur de succès professionnel dans sa compagnie est la maîtrise de son métier.","themes":["Travail / emploi / salaire / carrière"],"audio":"src/production-orale/tache3/examples/audio/201-principal-facteur-succes-professionnel-compagnie-maitrise-metier.mp3","answer":["On entend souvent dire que pour réussir au travail, il suffit d'être excellent dans son domaine. C'est une idée qui mérite réflexion. Pour ma part, je ne suis qu'à moitié d'accord : la maîtrise de son métier est essentielle, mais je ne crois pas qu'elle soit le principal facteur de succès. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, il est vrai que la compétence technique constitue une base incontournable. En effet, sans savoir-faire solide, on perd la confiance de ses collègues et de ses supérieurs, et l'on peine à accomplir correctement ses missions. Par exemple, un comptable qui ne maîtrise pas les chiffres ou un médecin qui se trompe dans ses diagnostics ne pourra jamais durablement progresser, quel que soit son charisme. La maîtrise du métier est donc la fondation sur laquelle tout repose, et sans elle, le reste s'écroule rapidement.","Ensuite, et c'est là le cœur de mon propos, la réussite dépend tout autant des compétences humaines et relationnelles. Cela permet de comprendre pourquoi des personnes très qualifiées stagnent parfois alors que d'autres, moins brillantes techniquement, gravissent rapidement les échelons. C'est notamment le cas des personnes qui savent communiquer, travailler en équipe, gérer les conflits et inspirer confiance. Savoir présenter ses idées, négocier ou fédérer un groupe pèse souvent plus lourd, au moment d'une promotion, qu'une expertise purement technique. Un bon chef d'équipe, par exemple, n'est pas forcément le meilleur technicien : c'est avant tout quelqu'un capable de motiver les autres et de prendre des décisions justes. À cela s'ajoute la ponctualité, la fiabilité et l'attitude positive, autant de qualités qui marquent durablement la réputation d'un employé.","Cependant, certaines personnes pensent que dans des métiers très spécialisés, comme la recherche ou l'ingénierie de pointe, seule l'excellence technique compte vraiment. Je comprends ce point de vue, car dans ces domaines la compétence est reine et une erreur peut coûter cher. Mais je crois qu'il n'en reste pas moins que, même là, savoir collaborer, communiquer ses résultats et s'intégrer dans une équipe finit toujours par faire la différence pour accéder à des postes à responsabilité. Un chercheur brillant mais incapable de présenter ses travaux ou de travailler avec les autres verra son talent rester dans l'ombre.","En conclusion, je pense que la maîtrise de son métier est une condition nécessaire mais pas suffisante du succès professionnel, car la réussite repose sur un équilibre entre savoir-faire technique et savoir-être relationnel. Tout bien pesé, je dirais que le vrai facteur de succès, c'est la capacité à conjuguer les deux."]},{"rank":202,"frequency":1,"subject":"Est-il réellement possible de changer ses coutumes alimentaires à l'âge adulte ?","themes":["Divers"],"audio":"src/production-orale/tache3/examples/audio/202-reellement-possible-changer-coutumes-alimentaires-l-age.mp3","answer":["Nos habitudes alimentaires se forment dès l'enfance, et beaucoup pensent qu'elles sont gravées dans le marbre. Pourtant, à une époque où l'on parle sans cesse de bien manger, la question se pose : peut-on vraiment changer sa façon de se nourrir une fois adulte ? Personnellement, j'en suis convaincu : c'est tout à fait possible, même si cela demande des efforts. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, l'être humain est doté d'une grande capacité d'adaptation, y compris en matière de goût. En effet, le palais s'éduque et se transforme avec l'exposition : un aliment qu'on détestait peut finir par devenir agréable à force d'y goûter. Par exemple, beaucoup de personnes qui n'aimaient pas les légumes dans leur jeunesse apprennent, à l'âge adulte, à les cuisiner différemment et finissent par les apprécier. La volonté et la répétition peuvent réécrire des préférences que l'on croyait définitives.","Ensuite, un changement de mode de vie ou un déclic personnel pousse souvent à transformer son alimentation. Cela permet de répondre à un problème de santé, à une prise de conscience écologique ou simplement à l'envie de se sentir mieux dans son corps. C'est notamment le cas des personnes qui deviennent végétariennes à trente ou quarante ans, ou de celles qui, après un avertissement de leur médecin, réduisent le sucre et le sel et y parviennent durablement. La motivation profonde est un moteur puissant qui permet de tenir bon dans la durée. De même, un déménagement à l'étranger oblige souvent à découvrir de nouveaux ingrédients et de nouvelles façons de cuisiner : beaucoup d'immigrants adoptent ainsi, presque sans s'en rendre compte, les plats de leur pays d'accueil.","Cependant, certaines personnes pensent que les habitudes ancrées depuis l'enfance, surtout celles liées à la culture et à la famille, sont presque impossibles à abandonner. Je comprends ce point de vue, car la nourriture est chargée de souvenirs et d'émotions, et un plat de notre enfance nous rattache à nos racines. Mais je crois qu'il ne s'agit pas de renier ces racines : on peut très bien conserver les plats qu'on aime tout en intégrant progressivement de nouvelles habitudes plus saines. Le changement n'est pas une rupture brutale, mais une évolution patiente qui se construit repas après repas, sans qu'il faille tout bouleverser d'un coup.","En conclusion, je pense qu'il est réellement possible de changer ses coutumes alimentaires à l'âge adulte, car la volonté, un déclic et la patience suffisent à transformer durablement nos goûts. Finalement, je dirais que tout dépend moins de l'âge que de la motivation que l'on y met."]},{"rank":203,"frequency":1,"subject":"Selon vous, les livres ont-ils perdu leur utilité dans la société actuelle ?","themes":["Lecture / livres / culture / art"],"audio":"src/production-orale/tache3/examples/audio/203-livres-ont-ils-perdu-utilite-societe-actuelle.mp3","answer":["Avec l'explosion des écrans, des vidéos et des réseaux sociaux, on entend parfois dire que le livre serait devenu un objet du passé. C'est une affirmation que je trouve excessive. Pour ma part, je suis convaincu que les livres n'ont rien perdu de leur utilité, bien au contraire. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, le livre reste un outil de connaissance et de réflexion sans équivalent. En effet, lire un ouvrage demande de la concentration et permet d'approfondir un sujet bien au-delà de ce qu'offre une vidéo de quelques minutes ou un article survolé en ligne. Par exemple, pour comprendre véritablement l'histoire d'un pays ou les rouages d'une science, un bon livre apporte une rigueur et une profondeur qu'aucune publication rapide sur Internet ne peut remplacer. Le livre nous apprend aussi à suivre un raisonnement long, ce qui muscle notre capacité d'attention.","Ensuite, la lecture nourrit l'imagination et enrichit la langue. Cela permet de développer le vocabulaire, l'orthographe et la sensibilité, tout en offrant une véritable évasion. C'est notamment le cas des romans, qui nous transportent dans d'autres univers et nous font vivre des émotions par procuration, comme si nous devenions un instant les personnages. Beaucoup de personnes décrivent la lecture d'un roman le soir comme un moment de calme précieux, loin de la frénésie des notifications et des écrans. Pour quelqu'un qui apprend une langue étrangère, lire est d'ailleurs l'un des meilleurs moyens d'enrichir son expression et de s'imprégner des tournures naturelles, bien plus efficacement qu'en regardant passivement des vidéos.","Cependant, certaines personnes pensent que tout est désormais disponible en ligne et que le livre papier est dépassé par les formats numériques et audio. Je comprends ce point de vue, et il est vrai que les supports évoluent et que les jeunes consomment l'information autrement. Mais je crois que le contenu d'un livre garde toute sa valeur, qu'on le lise sur papier ou sur une liseuse : ce qui compte, c'est l'acte de lire en profondeur, et celui-ci demeure irremplaçable face à la consommation superficielle d'informations. Le livre numérique reste un livre ; ce n'est pas le format qui fait sa richesse, mais la concentration et la réflexion qu'il exige.","En conclusion, je pense que les livres n'ont absolument pas perdu leur utilité dans la société actuelle, car ils restent une source incomparable de savoir, de réflexion et d'imagination. On pourrait même se demander si, dans un monde saturé d'images rapides, ils ne sont pas devenus plus précieux que jamais."]},{"rank":204,"frequency":1,"subject":"Est-il possible de se passer de médicaments aujourd'hui ?","themes":["Santé / alimentation / mode de vie"],"audio":"src/production-orale/tache3/examples/audio/204-possible-passer-medicaments.mp3","answer":["La santé naturelle est à la mode, et de plus en plus de personnes se méfient des médicaments et cherchent des alternatives. La question mérite donc d'être posée : peut-on réellement se passer de médicaments de nos jours ? Personnellement, je pense que ce n'est pas possible de façon totale, même si l'on peut souvent en limiter l'usage. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, les médicaments restent indispensables pour traiter de nombreuses maladies graves. En effet, certaines pathologies ne peuvent tout simplement pas être soignées autrement, et les remèdes naturels y sont impuissants. Par exemple, une personne diabétique a besoin d'insuline pour survivre, et un patient atteint d'une infection bactérienne sérieuse doit prendre des antibiotiques sous peine de complications dangereuses. Refuser ces traitements par principe reviendrait à mettre sa vie en péril.","Ensuite, la médecine moderne a considérablement allongé l'espérance de vie grâce aux médicaments et aux vaccins. Cela permet de prévenir des épidémies et de guérir des maux qui, autrefois, décimaient des populations entières. C'est notamment le cas des vaccinations qui ont fait reculer des maladies comme la poliomyélite ou la rougeole, et plus récemment des traitements qui ont permis de limiter les ravages de la pandémie. Se passer totalement de ces avancées serait un recul considérable pour la santé publique, et nous ramènerait à une époque où une simple infection pouvait être fatale.","Cependant, certaines personnes pensent qu'un mode de vie sain, fait d'une bonne alimentation, d'activité physique et de gestion du stress, permettrait de se passer de tout médicament. Je comprends ce point de vue, et il contient une part de vérité : beaucoup de petits maux du quotidien, comme un léger mal de tête, un rhume ou des troubles digestifs passagers, peuvent en effet être évités ou soulagés sans pilule. Il est d'ailleurs vrai que notre société consomme parfois trop de médicaments, par facilité ou par habitude. Mais je crois qu'il ne faut pas confondre la prévention, très utile, avec le soin des maladies réelles, pour lequel les médicaments demeurent souvent incontournables. Vouloir tout soigner naturellement reviendrait, dans bien des cas, à jouer dangereusement avec sa santé.","En conclusion, je pense qu'il n'est pas possible de se passer entièrement de médicaments aujourd'hui, car ils sauvent des vies et soignent ce qu'aucune méthode naturelle ne peut guérir. Tout bien pesé, je dirais que l'idéal est d'adopter un mode de vie sain pour en réduire l'usage, sans pour autant les rejeter quand ils sont nécessaires."]},{"rank":205,"frequency":1,"subject":"Est-ce plus facile de s'adapter à un nouveau pays quand on est jeune ?","themes":["Immigration / vivre à l'étranger / intégration"],"audio":"src/production-orale/tache3/examples/audio/205-facile-s-adapter-nouveau-pays-quand-jeune.mp3","answer":["L'immigration concerne aujourd'hui des personnes de tous âges, et l'on se demande souvent si la jeunesse constitue un avantage pour s'intégrer ailleurs. C'est une question qui me touche de près. Personnellement, je pense qu'il est globalement plus facile de s'adapter à un nouveau pays quand on est jeune, même si l'âge n'est pas le seul facteur. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, les jeunes apprennent la langue du pays d'accueil avec beaucoup plus de facilité. En effet, leur cerveau est plus souple et ils n'ont pas encore les blocages qui freinent souvent les adultes. Par exemple, un enfant scolarisé dans un nouveau pays parle généralement la langue locale sans accent au bout de quelques mois, alors que ses parents continueront longtemps à chercher leurs mots et à se faire corriger. Or la langue est la clé de l'intégration : la maîtriser ouvre toutes les portes.","Ensuite, les jeunes s'adaptent plus aisément aux codes sociaux et culturels. Cela permet de tisser rapidement des liens d'amitié et de se sentir chez soi. C'est notamment le cas des étudiants qui partent à l'étranger : grâce à l'école ou à l'université, ils sont plongés dans un réseau de camarades et adoptent vite les habitudes locales. Ayant moins de repères figés et moins de responsabilités à gérer, ils acceptent plus naturellement les différences au lieu de les comparer sans cesse à leur pays d'origine. Là où un adulte risque de juger ou de regretter ses anciennes habitudes, un jeune voit avant tout une aventure et de nouvelles découvertes, ce qui rend son intégration beaucoup plus fluide.","Cependant, certaines personnes pensent que les adultes s'adaptent tout aussi bien, car ils sont plus matures, plus motivés et conscients de ce qu'ils recherchent. Je comprends ce point de vue, car la motivation joue un rôle énorme et un adulte déterminé, qui a choisi son projet de vie, peut très bien réussir son intégration. Mais je crois qu'il n'en reste pas moins que le jeune part avec un avantage naturel : il absorbe la nouvelle culture presque sans effort, là où l'adulte doit travailler dur pour y parvenir. J'en suis moi-même la preuve : arrivé à l'âge adulte, j'ai dû fournir beaucoup d'efforts pour la langue et les codes, alors qu'un enfant aurait tout assimilé spontanément à l'école.","En conclusion, je pense qu'il est plus facile de s'adapter à un nouveau pays quand on est jeune, car la langue, les amitiés et les codes culturels s'acquièrent alors plus spontanément. Cela dit, je dirais que la volonté et l'ouverture d'esprit restent décisives à tout âge."]},{"rank":206,"frequency":1,"subject":"Selon vous, les prestations sociales réduisent-elles la solidarité entre les membres d'une famille ?","themes":["Famille / amitié / relations / célibat","Citoyenneté / solidarité / bénévolat / État"],"audio":"src/production-orale/tache3/examples/audio/206-prestations-sociales-reduisent-elles-solidarite-entre-membres.mp3","answer":["Dans les pays développés, l'État joue un rôle important en versant des aides aux personnes âgées, aux chômeurs ou aux familles. Certains se demandent si ce filet de sécurité ne nuit pas aux liens familiaux. C'est un débat intéressant. Pour ma part, je ne crois pas que les prestations sociales réduisent la solidarité entre les membres d'une famille ; je pense même qu'elles la préservent. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, les aides de l'État soulagent les familles d'un poids financier qui pourrait, au contraire, créer des tensions. En effet, lorsqu'une personne âgée ou malade n'a aucun revenu, c'est toute la famille qui doit subvenir à ses besoins, parfois au prix de sacrifices et de conflits. Par exemple, sans pension de retraite, des enfants devraient entièrement entretenir leurs parents âgés, ce qui peut engendrer des disputes sur la répartition des dépenses entre frères et sœurs. Les prestations évitent que l'argent ne devienne une source de discorde.","Ensuite, les aides permettent à la solidarité familiale de s'exprimer autrement que par l'argent. Cela permet aux proches de se concentrer sur le soutien affectif, le temps passé ensemble et l'accompagnement, plutôt que sur les seules questions matérielles. C'est notamment le cas des familles qui, déchargées du souci financier, peuvent rendre visite à leurs aînés et leur tenir compagnie sans l'angoisse permanente des factures à payer. La solidarité y gagne en qualité, car elle repose alors sur l'amour et le choix, et non sur l'obligation. Une personne qui aide ses parents par devoir financier le fait souvent à contrecœur ; celle qui les soutient librement le fait avec bien plus de cœur.","Cependant, certaines personnes pensent qu'en s'appuyant sur l'État, les gens se déresponsabilisent et comptent moins les uns sur les autres. Je comprends ce point de vue, car il est vrai que dans certaines sociétés très individualistes, on confie volontiers ses aînés à des institutions et l'on se repose entièrement sur le système. Mais je crois que ce n'est pas la faute des prestations elles-mêmes : c'est une question de valeurs et de culture. Une aide financière n'empêche personne d'aimer et de soutenir sa famille ; dans bien des pays où l'État est généreux, les liens familiaux restent pourtant très forts. Tout dépend, au fond, de la place qu'une société accorde à la famille.","En conclusion, je pense que les prestations sociales ne réduisent pas la solidarité familiale, car elles éliminent une source de tension et libèrent les proches pour un soutien plus humain. Tout bien pesé, je dirais qu'elles complètent la solidarité familiale au lieu de la remplacer."]},{"rank":207,"frequency":1,"subject":"Quels impacts et quels risques peuvent avoir l'usage régulier des téléphones, des ordinateurs et des tablettes ?","themes":["Télévision / médias / information","Téléphone portable / smartphone / écrans"],"audio":"src/production-orale/tache3/examples/audio/207-quels-impacts-quels-risques-peuvent-avoir-l.mp3","answer":["Les écrans sont devenus omniprésents dans nos vies : on les utilise pour travailler, communiquer et nous divertir du matin au soir. Cette omniprésence soulève une vraie inquiétude quant à ses effets. Pour ma part, je pense que ces appareils ont des impacts à la fois positifs et négatifs, mais que leur usage excessif comporte de réels risques. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, il faut reconnaître que ces outils ont transformé notre quotidien de façon très positive. En effet, ils nous donnent accès à une masse d'informations, facilitent le travail à distance et nous permettent de rester en contact avec nos proches partout dans le monde. Par exemple, un immigrant peut, grâce à une simple application, parler chaque jour avec sa famille restée dans son pays d'origine, ce qui aurait été impensable il y a quelques décennies. Bien utilisés, ces appareils sont donc une formidable avancée.","Ensuite, leur usage régulier comporte cependant des risques sérieux pour la santé physique et mentale. Cela peut entraîner des troubles du sommeil, une fatigue visuelle, des douleurs au dos et au cou, sans parler des effets sur la concentration, l'humeur et même l'anxiété. C'est notamment le cas des personnes qui consultent leur téléphone juste avant de dormir : la lumière des écrans perturbe l'endormissement et dégrade la qualité du repos. Chez les enfants, un usage excessif peut aussi nuire au développement, réduire les interactions réelles et créer une forme de dépendance préoccupante. À cela s'ajoute le risque d'isolement : à force de vivre derrière un écran, certains finissent par préférer les relations virtuelles aux véritables rencontres.","Cependant, certaines personnes pensent que ces craintes sont exagérées et que tout est question de génération et d'habitude. Je comprends ce point de vue, car les jeunes manient ces outils avec une aisance naturelle et y trouvent de réels bénéfices. Mais je crois qu'il ne faut pas confondre aisance et bon usage : savoir se servir d'un écran ne signifie pas savoir s'en détacher. Le vrai enjeu n'est pas l'outil lui-même, mais la modération avec laquelle on l'emploie. Un couteau peut servir à cuisiner comme à blesser ; tout dépend de la main qui le tient. Il en va de même pour ces appareils, qui ne sont ni bons ni mauvais en eux-mêmes.","En conclusion, je pense que l'usage régulier des téléphones, des ordinateurs et des tablettes apporte d'immenses bénéfices, mais comporte des risques bien réels pour la santé et le lien social. Finalement, je dirais que tout repose sur l'équilibre : c'est à nous de rester maîtres de ces appareils plutôt que de nous laisser dominer par eux."]},{"rank":208,"frequency":1,"subject":"Pour favoriser l'égalité, certains pays imposent la parité hommes-femmes dans le domaine politique. Qu'en pensez-vous ?","themes":["Égalité hommes-femmes / droits des femmes","Politique / engagement des jeunes"],"audio":"src/production-orale/tache3/examples/audio/208-favoriser-l-egalite-certains-pays-imposent-parite.mp3","answer":["La place des femmes en politique est un sujet qui divise l'opinion publique. Pour la renforcer, plusieurs pays imposent désormais la parité sur les listes électorales et dans les assemblées. Pour ma part, je suis favorable à cette mesure, que je considère comme un outil utile, du moins de façon temporaire. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, la parité imposée permet de corriger une inégalité historique bien réelle. En effet, pendant des siècles, les femmes ont été écartées des lieux de pouvoir, et les mentalités ne changent pas du jour au lendemain. Par exemple, dans de nombreux pays, sans loi contraignante, les partis politiques continuaient à présenter une écrasante majorité d'hommes, perpétuant ainsi un déséquilibre qui n'avait rien de naturel. Une règle stricte vient briser ce cercle vicieux et oblige les responsables à donner enfin leur chance aux femmes, là où les bonnes intentions seules n'avaient jamais suffi.","Ensuite, la présence de femmes en politique apporte des perspectives nouvelles et bénéficie à toute la société. Cela permet de mieux représenter la moitié de la population et de mettre à l'ordre du jour des sujets parfois négligés, comme la conciliation entre vie familiale et vie professionnelle, ou la lutte contre les violences. C'est notamment le cas des pays scandinaves, où une forte présence féminine au gouvernement a accompagné des politiques sociales parmi les plus avancées du monde. La diversité enrichit la prise de décision, car un gouvernement qui ressemble à sa population la comprend forcément mieux. À l'inverse, une assemblée composée presque uniquement d'hommes risque d'ignorer la moitié des préoccupations des citoyens.","Cependant, certaines personnes pensent qu'imposer un quota revient à choisir les responsables selon leur sexe plutôt que selon leur compétence. Je comprends ce point de vue, car l'idéal serait évidemment que chacun accède au pouvoir sur ses seuls mérites. Mais je crois qu'à compétence égale, les femmes étaient injustement écartées, et que sans mesure incitative, l'égalité réelle mettrait des générations à se réaliser. La parité n'est pas une fin en soi, mais un tremplin vers une représentation enfin équitable. D'ailleurs, les compétences ne manquent pas du côté des femmes : c'est l'accès aux candidatures qui leur faisait défaut.","En conclusion, je pense qu'imposer la parité en politique est une bonne chose, car cette mesure corrige une injustice ancienne et fait progresser concrètement l'égalité. On pourrait même espérer qu'un jour, les mentalités ayant évolué, une telle loi devienne tout simplement inutile."]},{"rank":209,"frequency":1,"subject":"Est-il nécessaire de vivre dans un pays pour vraiment comprendre sa culture ?","themes":["Immigration / vivre à l'étranger / intégration","Langues étrangères"],"audio":"src/production-orale/tache3/examples/audio/209-necessaire-vivre-pays-vraiment-comprendre-culture.mp3","answer":["On peut aujourd'hui découvrir n'importe quelle culture depuis son canapé, à travers les films, les livres et Internet. Pourtant, beaucoup affirment que rien ne remplace l'expérience vécue sur place. Personnellement, je pense qu'il est effectivement nécessaire de vivre dans un pays pour en comprendre vraiment la culture, même si l'on peut déjà s'y initier de loin. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, vivre dans un pays permet de saisir des aspects de la culture qui ne se trouvent dans aucun livre. En effet, la culture, ce ne sont pas seulement les monuments et l'histoire, mais aussi mille détails du quotidien : l'humour, les codes de politesse, le rythme de vie, la façon de saluer ou de faire la queue. Par exemple, on peut lire des dizaines d'ouvrages sur le Québec, mais ce n'est qu'en y vivant qu'on comprend vraiment l'importance de l'hiver dans la mentalité des gens ou les subtilités de la langue parlée dans la rue.","Ensuite, l'immersion oblige à dépasser les clichés et à entrer en contact direct avec les habitants. Cela permet de remplacer les idées toutes faites par une compréhension nuancée et vivante. C'est notamment le cas des immigrants qui, après quelques années sur place, réalisent que l'image qu'ils avaient de leur pays d'accueil avant de partir était souvent simpliste, voire fausse. Vivre les fêtes, les conflits et les habitudes locales de l'intérieur change radicalement le regard. On découvre alors que derrière les stéréotypes véhiculés par les médias se cache une réalité bien plus complexe et contradictoire, faite de mille nuances qu'aucun guide touristique ne peut résumer.","Cependant, certaines personnes pensent qu'on peut très bien connaître une culture sans y avoir jamais mis les pieds, grâce à l'étude, aux documentaires et aux rencontres avec des gens de ce pays. Je comprends ce point de vue, et il est vrai qu'on peut acquérir de solides connaissances à distance, surtout aujourd'hui avec Internet. Mais je crois qu'il y a une différence fondamentale entre connaître une culture intellectuellement et la comprendre de l'intérieur, avec ses émotions et son corps. Le savoir livresque reste extérieur ; l'expérience vécue, elle, transforme. On ne comprend vraiment la rudesse d'un hiver ou la chaleur d'une fête populaire qu'en les ayant ressentis soi-même.","En conclusion, je pense qu'il est nécessaire de vivre dans un pays pour en comprendre véritablement la culture, car seule l'immersion révèle ce que les livres ne peuvent transmettre. Cela dit, je dirais que l'étude préalable reste une excellente première étape avant le grand saut."]},{"rank":210,"frequency":1,"subject":"Est-il facile de travailler dans un autre pays ?","themes":["Travail / emploi / salaire / carrière"],"audio":"src/production-orale/tache3/examples/audio/210-facile-travailler-autre-pays.mp3","answer":["À une époque où de plus en plus de personnes partent travailler à l'étranger, on pourrait croire que cela va de soi. Pourtant, l'expérience est rarement aussi simple qu'on l'imagine. Pour ma part, je pense que travailler dans un autre pays n'est pas facile : c'est une aventure enrichissante, mais semée d'obstacles, surtout au début. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, la barrière de la langue rend le travail épuisant, même avec un bon niveau. En effet, au bureau, il ne suffit pas de se débrouiller : il faut convaincre, négocier et saisir les sous-entendus comme l'humour des collègues. Par exemple, une personne qui travaille dans une langue étrangère constate souvent qu'une simple réunion lui demande beaucoup plus d'énergie que dans sa langue maternelle, et qu'elle rentre chez elle épuisée par cet effort constant.","Ensuite, il y a les obstacles administratifs et la reconnaissance des diplômes. Cela permet de comprendre pourquoi tant d'immigrés qualifiés doivent recommencer en bas de l'échelle. C'est notamment le cas des médecins ou des ingénieurs étrangers, qui doivent fréquemment refaire une partie de leurs études ou accepter un poste en dessous de leurs compétences avant de retrouver leur niveau. S'ajoutent à cela les codes professionnels propres à chaque pays, comme le rapport à la hiérarchie ou à la ponctualité, qu'il faut du temps pour décoder.","Cependant, certaines personnes pensent que c'est devenu plus facile qu'avant : dans des secteurs comme l'informatique, les entreprises recrutent à l'international et l'anglais suffit souvent à décrocher un poste. Je comprends ce point de vue, et il est vrai que pour certains profils très demandés, les portes s'ouvrent rapidement, parfois même avant l'arrivée dans le pays. Mais je crois qu'il n'en reste pas moins que l'adaptation humaine et culturelle demande du temps, des efforts et beaucoup de patience, quel que soit le métier. Trouver un emploi n'est qu'une première étape ; s'y sentir vraiment à l'aise, comprendre ses collègues et bâtir un réseau prennent bien plus de temps qu'on ne l'imagine.","En conclusion, je pense que travailler dans un autre pays n'est pas facile, car il faut surmonter la barrière de la langue, les démarches administratives et les différences culturelles. Mais ces difficultés sont temporaires et formatrices : finalement, je dirais que le jeu en vaut largement la chandelle."]},{"rank":211,"frequency":1,"subject":"Le développement des achats sur Internet pourrait-il entraîner la disparition des magasins physiques ?","themes":["Technologie / Internet / réseaux sociaux"],"audio":"src/production-orale/tache3/examples/audio/211-developpement-achats-internet-pourrait-entrainer-disparition-magasins.mp3","answer":["Le commerce en ligne connaît une croissance fulgurante : on peut désormais tout acheter d'un simple clic, sans sortir de chez soi. Faut-il en conclure que les magasins traditionnels sont condamnés à disparaître ? Pour ma part, je ne le crois pas : le commerce en ligne va certainement transformer les magasins physiques, mais pas les faire disparaître. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, le magasin physique offre une expérience que l'écran ne peut pas reproduire. En effet, dans une boutique, on peut toucher les produits, les essayer, comparer les matières et obtenir un conseil immédiat d'un vendeur. Par exemple, pour acheter des chaussures ou un vêtement, beaucoup de gens préfèrent encore se rendre en magasin afin d'être sûrs de la taille et du confort, ce qu'une photo en ligne ne garantit jamais. Cette dimension sensorielle reste un atout majeur.","Ensuite, faire les courses ou les boutiques répond aussi à un besoin social et de loisir. Cela permet de sortir, de se promener, de partager un moment avec des amis ou en famille. C'est notamment le cas des centres commerciaux et des marchés, qui sont devenus de véritables lieux de vie où l'on flâne autant qu'on achète. L'humain a besoin de contacts réels, et l'achat physique satisfait ce besoin que l'écran ne comble pas. Pour beaucoup de gens, surtout les personnes âgées ou celles qui vivent seules, le passage à la boutique du quartier est aussi l'occasion d'échanger quelques mots et de rompre la solitude, ce qu'aucune livraison à domicile ne remplacera jamais.","Cependant, certaines personnes pensent que la commodité et les prix attractifs d'Internet finiront par l'emporter, condamnant les commerces de proximité. Je comprends ce point de vue, car il est vrai que de nombreuses boutiques ont fermé et que la concurrence en ligne est rude, notamment pour les petits commerçants. Mais je crois que les magasins ne disparaîtront pas : ils évolueront, en misant sur le service, l'expérience et la complémentarité avec le numérique. Beaucoup d'enseignes combinent d'ailleurs déjà vente en ligne et retrait en boutique, prouvant que les deux mondes peuvent parfaitement coexister plutôt que de s'exclure.","En conclusion, je pense que le développement des achats sur Internet ne fera pas disparaître les magasins physiques, car ceux-ci offrent une expérience humaine et sensorielle irremplaçable. Tout bien pesé, je dirais que l'avenir appartient sans doute à une cohabitation intelligente entre le commerce en ligne et le commerce traditionnel."]},{"rank":212,"frequency":1,"subject":"Pensez-vous que les jeunes s'impliquent moins aujourd'hui dans des domaines comme l'environnement, la politique ou la santé ?","themes":["Environnement / pollution / écologie","Santé / alimentation / mode de vie","Générations / jeunes / personnes âgées","Politique / engagement des jeunes"],"audio":"src/production-orale/tache3/examples/audio/212-jeunes-s-impliquent-domaines-comme-l-environnement.mp3","answer":["On entend souvent dire que la jeunesse actuelle serait passive, désengagée, plus préoccupée par ses écrans que par le monde qui l'entoure. C'est un reproche qui revient à chaque génération. Pour ma part, je ne suis pas du tout d'accord : je pense que les jeunes d'aujourd'hui ne s'impliquent pas moins, mais qu'ils s'engagent autrement. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, les jeunes sont très actifs sur les grandes questions de société, à commencer par l'environnement. En effet, ils sont nombreux à se mobiliser pour le climat, à modifier leurs habitudes de consommation et à interpeller les responsables politiques. Par exemple, les marches pour le climat qui ont rassemblé des millions de jeunes à travers le monde montrent une génération profondément consciente des enjeux écologiques, bien plus que ne l'étaient leurs aînés au même âge.","Ensuite, leur engagement passe par de nouveaux moyens, notamment numériques, qu'il ne faut pas sous-estimer. Cela permet de sensibiliser, de pétitionner et d'organiser des actions à une échelle inédite, par-delà les frontières. C'est notamment le cas des campagnes lancées sur les réseaux sociaux, qui peuvent informer des millions de personnes en quelques heures et faire reculer des décisions injustes ou des entreprises peu scrupuleuses. En matière de santé aussi, les jeunes s'intéressent de près au bien-être mental, à l'alimentation et au sport, des sujets longtemps négligés par leurs aînés. Ils osent parler ouvertement de la santé psychologique, brisant des tabous qui pesaient depuis des décennies.","Cependant, certaines personnes pensent que les jeunes désertent les formes traditionnelles d'engagement, comme les partis politiques ou le vote. Je comprends ce point de vue, car les chiffres montrent en effet une certaine désaffection pour les urnes et les structures classiques. Mais je crois que cela ne traduit pas un désintérêt pour la chose publique : c'est plutôt une défiance envers des institutions qu'ils jugent dépassées et peu à leur écoute. Ils s'engagent simplement par d'autres canaux qui leur paraissent plus efficaces et plus concrets, comme le bénévolat, les associations ou les actions locales. Le militantisme a changé de forme, mais il n'a pas faibli.","En conclusion, je pense que les jeunes ne s'impliquent pas moins aujourd'hui, car ils sont très présents sur l'environnement, la santé et les grandes causes, mais à travers des formes nouvelles d'engagement. On pourrait même se demander si ce ne sont pas, au fond, les institutions qui doivent s'adapter à eux."]},{"rank":213,"frequency":1,"subject":"Devrait-on obliger toutes les personnes pouvant travailler depuis chez elles à pratiquer le télétravail ?","themes":["Travail / emploi / salaire / carrière","Télévision / médias / information"],"audio":"src/production-orale/tache3/examples/audio/213-devrait-obliger-toutes-personnes-pouvant-travailler-depuis.mp3","answer":["Depuis la pandémie, le télétravail s'est imposé dans de nombreux métiers et il continue de diviser. Certains imaginent même qu'on pourrait le rendre obligatoire pour tous ceux qui en ont la possibilité. C'est une idée séduisante mais discutable. Pour ma part, je pense qu'il faut encourager le télétravail, mais certainement pas l'imposer à tout le monde. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, le télétravail présente de réels avantages qu'il serait dommage de négliger. En effet, il réduit les trajets, fait gagner du temps et diminue la pollution liée aux déplacements quotidiens. Par exemple, une personne qui passait deux heures par jour dans les embouteillages peut désormais consacrer ce temps à sa famille ou au repos, tout en réduisant son empreinte carbone. À ce titre, encourager le travail à distance est une excellente chose pour la qualité de vie comme pour l'environnement.","Ensuite, rendre le télétravail obligatoire poserait toutefois de sérieux problèmes humains. Cela permettrait certes des économies aux entreprises, mais au prix d'un isolement croissant des salariés. C'est notamment le cas des personnes qui vivent seules, dans de petits logements, et pour qui le bureau représente un lieu de vie sociale essentiel. Priver ces gens de tout contact direct avec leurs collègues nuirait à leur moral et, à terme, à leur efficacité comme à leur santé mentale. De plus, certains métiers gagnent énormément à la présence physique : les échanges informels, les discussions spontanées et la créativité collective se perdent souvent derrière un écran. Imposer le télétravail reviendrait à sacrifier cette richesse au nom de la seule logique financière.","Cependant, certaines personnes pensent qu'une obligation générale serait la solution la plus juste et la plus écologique. Je comprends ce point de vue, car cela garantirait à chacun les mêmes conditions et réduirait fortement les déplacements et la pollution. Mais je crois qu'imposer une règle unique à des situations très différentes serait une erreur : ce qui convient à l'un peut être insupportable pour l'autre. La liberté de choix me paraît bien plus respectueuse des besoins de chacun. Un parent de jeunes enfants n'a pas les mêmes contraintes qu'un jeune célibataire en quête de contacts ; une bonne politique doit tenir compte de cette diversité plutôt que de l'écraser.","En conclusion, je pense qu'il ne faut pas obliger toutes les personnes pouvant travailler de chez elles à pratiquer le télétravail, car le mieux est d'offrir un cadre souple où chacun choisit selon sa situation. Tout bien pesé, je dirais que la formule idéale est sans doute un modèle hybride, alternant présence au bureau et travail à domicile."]},{"rank":214,"frequency":1,"subject":"Vivre plusieurs mois dans un pays étranger est-il nécessaire pour aider les jeunes à devenir indépendants ?","themes":["Immigration / vivre à l'étranger / intégration","Générations / jeunes / personnes âgées"],"audio":"src/production-orale/tache3/examples/audio/214-vivre-plusieurs-mois-pays-etranger-necessaire-aider.mp3","answer":["De nombreux jeunes rêvent de partir étudier ou travailler à l'étranger pour quelques mois, et l'on présente souvent cette expérience comme une étape clé vers l'autonomie. La formule fait-elle pour autant figure de passage obligé ? Pour ma part, je pense qu'un séjour prolongé à l'étranger aide énormément les jeunes à devenir indépendants, sans pour autant être strictement nécessaire. Pour justifier mon opinion, je vous donnerai quelques arguments, suivis de quelques exemples.","Tout d'abord, vivre loin de chez soi force à se débrouiller seul et à grandir vite. En effet, une fois éloigné de ses parents, le jeune doit gérer son budget, faire ses courses, cuisiner, payer ses factures et résoudre seul les imprévus. Par exemple, un étudiant parti six mois dans une autre ville à l'étranger apprend rapidement à se prendre en charge, car il ne peut plus compter sur sa famille au moindre problème. Cette confrontation directe à la vie réelle est une école d'autonomie redoutablement efficace.","Ensuite, un séjour à l'étranger développe la confiance en soi et l'ouverture d'esprit. Cela permet d'apprendre une langue, de s'adapter à une autre culture et de surmonter des difficultés inédites. C'est notamment le cas des jeunes qui reviennent de l'étranger transformés, plus mûrs et plus sûrs d'eux, parce qu'ils ont prouvé qu'ils étaient capables de réussir seuls dans un environnement inconnu. Cette expérience laisse une marque durable sur la personnalité : avoir surmonté la barrière de la langue, la solitude et les imprévus donne une assurance que rien ne peut remplacer. Le jeune découvre aussi d'autres façons de penser et de vivre, ce qui le rend plus tolérant et plus curieux pour le reste de son existence.","Cependant, certaines personnes pensent qu'on peut très bien devenir indépendant sans jamais quitter son pays. Je comprends ce point de vue, car il est vrai qu'un jeune qui prend un logement seul, travaille pour financer ses études et assume ses responsabilités gagne aussi beaucoup en autonomie. Tout le monde n'a d'ailleurs pas les moyens financiers de partir à l'étranger. Mais je crois qu'il y a une différence de degré : à l'étranger, sans aucun repère et sans filet familial à proximité, l'apprentissage de l'indépendance est plus intense, plus rapide et plus complet, car on ne peut compter que sur soi-même.","En conclusion, je pense que vivre plusieurs mois à l'étranger est un puissant accélérateur d'indépendance pour les jeunes, sans être pour autant l'unique chemin possible. Finalement, je dirais que ce qui compte vraiment, c'est de sortir de sa zone de confort, que ce soit ailleurs ou chez soi."]}];
const CONTENT = {"taches":[{"id":"t1","num":1,"title":"Entretien dirigé","eyebrow":"Tâche 1 · Présentation","duree":"2 min","prep":"Sans préparation","desc":"Vous vous présentez : parcours, vie actuelle, projets — un monologue, mais l'examinateur peut vous interrompre.","lede":"La première tâche : vous vous présentez pendant environ deux minutes — un véritable monologue de présentation (parcours, vie actuelle, projets), pas une simple série de questions-réponses.","sections":[{"band":"Comprendre","id":"t1-format","title":"Le format","blocks":[{"type":"format","rows":[["Durée","<strong>2 minutes</strong>"],["Préparation","<strong>Aucune</strong> — entretien dirigé sans préparation"],["Ce que vous faites","Vous vous présentez : votre parcours, votre vie actuelle, vos projets"],["Objectif officiel","« Échanger avec une personne qu'il ne connaît pas »"]],"badges":[{"icon":"clock","label":"2 min","cls":"badge-brand"},{"label":"Sans préparation","cls":"badge-neutral"}]},{"type":"callout","variant":"warn","title":"On vous interrompt souvent.","html":"C'est une présentation, mais il est très courant que l'examinateur vous coupe pour poser une question pendant que vous parlez. Ce n'est pas un piège : <strong>répondez brièvement, puis reprenez</strong> votre présentation là où vous vous étiez arrêté(e)."}]},{"band":"Comprendre","id":"t1-structure","title":"La structure : passé → présent → futur","blocks":[{"type":"prose","html":"<p>Couvrez les <strong>trois temps</strong> : c'est exactement ce que l'examinateur vérifie ici — votre maîtrise des temps.</p>"},{"type":"steps","items":[{"n":"P","titre":"Passé","color":"var(--cat-immigration)","desc":"<strong>Passé composé, imparfait, plus-que-parfait.</strong> D'où vous venez, votre enfance, vos études, votre arrivée au Canada."},{"n":"R","titre":"Présent","color":"var(--cat-sante)","desc":"<strong>Présent de l'indicatif.</strong> Votre vie actuelle, votre travail, vos loisirs."},{"n":"F","titre":"Futur","color":"var(--cat-travail)","desc":"<strong>Futur simple.</strong> Vos projets — visez au moins <strong>3 phrases au futur simple</strong>."}]},{"type":"callout","variant":"accent","html":"Astuce notation : glissez au moins <strong>3 phrases au futur simple</strong> dans vos projets (« je passerai », « je ferai », « je parlerai », « je serai »). C'est explicitement attendu."}]},{"band":"Comprendre","id":"t1-themes","title":"Les thèmes à couvrir","blocks":[{"type":"tags","items":["Nom, prénom","Nationalité","État civil","Âge","Origine","Où vous avez habité","Formation / études","Pourquoi le Canada","Arrivée au Canada","Où vous habitez","Travail","Loisirs (été & hiver)","Projets futurs"]},{"type":"prose","html":"<p>Déroulez votre présentation en piochant dans cette liste. Et surtout, <strong>donnez des détails</strong> : ce sont eux qui font la différence. L'examinateur peut aussi rebondir sur la famille, vos goûts, vos conditions de vie, un événement passé ou vos voyages.</p>"}]},{"band":"Comprendre","id":"t1-reflexes","title":"Réflexes & erreurs fréquentes","blocks":[{"type":"reflexes","items":["Présentez-vous de façon fluide et structurée : passé → présent → futur.","Donnez des détails — « je m'appelle X, j'ai Y ans » ne suffit pas.","Préparez vos projets : au moins 3 phrases au futur simple.","Si on vous interrompt, répondez court puis reprenez.","Variez les temps : passé composé, imparfait, présent, futur.","Restez naturel et souriez : c'est un échange, pas une récitation."]},{"type":"reflexes","variant":"danger","items":["Réciter une liste plate, sans détails ni connecteurs.","Se figer quand l'examinateur interrompt — c'est normal, rebondissez.","N'utiliser que le présent : on passe à côté du passé et du futur attendus.","Parler trop peu — visez les 2 minutes, occupez le temps.","Oublier les projets au futur simple."]}]},{"band":"Voir","id":"t1-fiche","title":"Fiche de présentation modèle","blocks":[{"type":"prose","html":"<p>Une présentation complète et <strong>fictive</strong> (Sofia), à utiliser comme modèle : remplacez les informations par les vôtres. Remarquez l'enchaînement passé → présent → futur ; le passage en gras regroupe les <strong>projets au futur simple</strong>.</p>"},{"type":"fiche","html":"<p>Bonjour, je m'appelle Sofia. J'ai 29 ans et je suis colombienne.</p><p>Je suis née et j'ai grandi à Medellín, une grande ville de montagne qu'on surnomme « la ville de l'éternel printemps », car le climat y est doux toute l'année.</p><p>Quand j'étais plus jeune, je rêvais déjà de travailler dans la santé. J'ai donc étudié les soins infirmiers et, après mon diplôme, j'ai travaillé cinq ans dans un hôpital de ma ville.</p><p>C'est pour cette raison que mon mari et moi avons décidé de nous installer au Canada, pour découvrir un autre pays et de meilleures opportunités.</p><p>Aujourd'hui, j'habite à Québec et je suis des cours de français pour faire reconnaître mon diplôme. Pendant mon temps libre, j'adore cuisiner ; en hiver, j'ai appris à patiner, et en été je fais du vélo dans le Vieux-Québec.</p><p><strong>À l'avenir, j'aimerais exercer de nouveau comme infirmière. Je passerai bientôt mon examen de français, puis je ferai les démarches nécessaires ; dans quelques années, j'espère que je parlerai couramment et que je serai parfaitement intégrée.</strong></p>"}]},{"band":"Voir","id":"t1-simulation","title":"Simulation (≈ 2 min, avec interruptions)","blocks":[{"type":"prose","html":"<p>Voici comment ça se passe réellement : vous présentez, l'examinateur vous coupe une ou deux fois, vous répondez court, puis vous <strong>reprenez</strong>.</p>"},{"type":"dialogue","turns":[{"who":"Examinateur","html":"Bonjour, installez-vous. Présentez-vous, je vous en prie."},{"who":"Vous","html":"Bonjour ! Avec plaisir. Je m'appelle Sofia, j'ai 29 ans et je suis colombienne, de Medellín, une ville de montagne au climat très doux. J'ai grandi là-bas, et depuis toujours je m'intéresse au domaine de la santé…"},{"who":"Examinateur","html":"<em>(vous interrompt)</em> Vous travailliez déjà dans ce domaine en Colombie ?"},{"who":"Vous","html":"Oui, tout à fait : j'ai étudié les soins infirmiers, puis j'ai travaillé cinq ans dans un hôpital de ma ville. <strong>Pour revenir à mon parcours</strong>, mon mari et moi avons ensuite décidé de nous installer au Canada."},{"who":"Examinateur","html":"Et pourquoi Québec en particulier ?"},{"who":"Vous","html":"Parce que c'est une ville calme et sécuritaire, où l'on vit en français. <strong>Aujourd'hui</strong>, j'y suis des cours de français pour faire reconnaître mon diplôme. <strong>À l'avenir</strong>, j'aimerais redevenir infirmière ici : je passerai bientôt mon examen, puis je ferai les démarches nécessaires, et j'espère que je serai vite intégrée."},{"who":"Examinateur","html":"Très bien, merci."}]}]},{"band":"S'entraîner","id":"t1-phrases","title":"Banque de phrases prêtes à l'emploi","blocks":[{"type":"prose","html":"<p>Touchez une phrase pour la copier. Apprenez-en quelques-unes par cœur pour démarrer sans hésiter et rebondir après une interruption.</p>"},{"type":"phrasebank","groups":[{"label":"Pour démarrer","phrases":["Bonjour ! Je m'appelle… et je viens de…","Avec plaisir, je vais me présenter."]},{"label":"Pour le passé","phrases":["J'ai grandi à…","Quand j'étais plus jeune, je…","Après mes études, j'ai commencé à…"]},{"label":"Pour le présent","phrases":["Aujourd'hui, je travaille comme…","Actuellement, je vis à…","En ce moment, j'apprends…"]},{"label":"Pour le futur","phrases":["À l'avenir, j'aimerais…","Dans quelques années, je + futur simple","Mon projet, c'est de…"]},{"label":"Pour gérer une interruption","phrases":["Pour revenir à ce que je disais…","Comme je le mentionnais…","J'y reviens : …"]}]}]},{"band":"S'entraîner","id":"t1-pratique","title":"S'entraîner à l'oral","blocks":[{"type":"callout","variant":"accent","title":"Entraînez-vous en conditions réelles.","html":"Demandez à la commande <strong>/tcf-pratique</strong> de jouer l'examinateur : il vous laisse vous présenter, vous interrompt parfois avec une question, puis corrige gentiment (temps, détails, fluidité)."}]}]},{"id":"t2","num":2,"title":"Exercice en interaction","eyebrow":"Tâche 2 · Interaction","duree":"5 min 30","prep":"2 min de préparation","desc":"Vous posez des questions à l'examinateur pour obtenir une information précise dans une situation courante.","lede":"La seule tâche avec préparation. On vous donne un rôle et une situation : vous menez l'échange en posant beaucoup de questions pour obtenir l'information dont vous avez besoin.","sections":[{"band":"Comprendre","id":"t2-format","title":"Le format","blocks":[{"type":"format","rows":[["Durée totale","<strong>5 min 30</strong> = <strong>2 min de préparation</strong> + <strong>3 min 30 d'interaction</strong>"],["Préparation","<strong>Oui</strong> — 2 min pour lire la consigne et noter vos questions (la seule tâche qui en a)"],["Ce que vous faites","Vous <strong>posez des questions</strong> à l'examinateur pour <strong>obtenir une information précise</strong> dans une situation courante"],["Objectif officiel","« Obtenir des informations dans une situation courante de la vie quotidienne »"]],"badges":[{"icon":"clock","label":"5 min 30","cls":"badge-brand"},{"label":"2 min de préparation","cls":"badge-neutral"},{"label":"La seule tâche avec préparation","cls":"badge-accent"}]},{"type":"callout","variant":"info","title":"C'est vous qui menez l'échange.","html":"On vous donne une <strong>consigne</strong> : un rôle et une situation de la vie quotidienne. À la Tâche 1 vous <strong>vous présentez</strong> ; ici vous <strong>interrogez</strong> l'examinateur pour accomplir une tâche concrète."}]},{"band":"Comprendre","id":"t2-preparation","title":"Bien utiliser les 2 minutes de préparation","blocks":[{"type":"steps","items":[{"n":"1","titre":"Lisez la consigne attentivement","color":"var(--cat-immigration)","desc":"Repérez 3 choses : <strong>votre rôle</strong> et <strong>qui est l'interlocuteur</strong> (un employé ? un ami ? un responsable d'association ?) → cela fixe le registre <strong>tu</strong> ou <strong>vous</strong> ; <strong>votre objectif</strong> : quelle information / quel service devez-vous obtenir ? ; <strong>le contexte</strong> : où, quand, pour quoi faire ?"},{"n":"2","titre":"Préparez beaucoup de questions","color":"var(--cat-travail)","desc":"<strong>Il en faut 12 à 18 pour réussir l'activité</strong> (repère donné par un examinateur). La méthode : à partir des <strong>mots-clés</strong> de la consigne, écrivez vite une <strong>liste de sous-thèmes</strong> (inscription, prix, horaires, conditions, logement, transports…). Puis, pour chaque sous-thème, <strong>dérivez des questions de précision</strong> (ex. « inscription » → documents nécessaires ? dates limites ? site internet ? faut-il traduire les documents ?). C'est ce « demander des précisions » qui vous fait atteindre les 12-18 questions."},{"n":"3","titre":"Variez la forme de vos questions","color":"var(--cat-education)","desc":"Voir la boîte à outils ci-dessous — ne posez pas 15 fois « est-ce que… »."},{"n":"4","titre":"Préparez votre amorce","color":"var(--cat-sante)","desc":"La phrase pour demander si la personne a un moment, puis votre première question. <strong>Démarrer sans hésiter donne le ton.</strong>"}]}]},{"band":"Comprendre","id":"t2-structures-b2","title":"Structures à caser au moins une fois (défi B2)","blocks":[{"type":"prose","html":"<p>Pendant la préparation, <strong>notez</strong> où vous allez glisser chacune de ces tournures, et employez-en <strong>au moins une fois chacune</strong> — elles montrent un bon niveau et varient vos questions. Touchez un exemple pour le copier.</p>"},{"type":"table","headers":["Structure","Quand l'utiliser","Exemple"],"copyCol":2,"rows":[["<strong>« Puis-je… ? »</strong>","demander une <strong>permission</strong> poliment","« <strong>Puis-je</strong> vous poser quelques questions ? »"],["<strong>« Y a-t-il… ? »</strong>","demander si <strong>quelque chose existe</strong>","« <strong>Y a-t-il</strong> un tarif réduit pour les étudiants ? »"],["<strong>« Faut-il que… »</strong> + <strong>subjonctif</strong>","demander une <strong>obligation / condition</strong>","« <strong>Faut-il que</strong> je <strong>m'inscrive</strong> à l'avance ? »"],["<strong>« Si + présent…, … + futur »</strong>","envisager une <strong>hypothèse</strong>","« <strong>Si</strong> je m'inscris aujourd'hui, est-ce que je <strong>pourrai</strong> commencer demain ? »"],["<strong>Le subjonctif</strong>","après « il faut que », « pour que », « j'aimerais que »…","« Que faut-il <strong>que je fasse</strong> pour réserver ? »"],["<strong>Le conditionnel</strong>","demande polie, hypothèse","« <strong>Pourriez</strong>-vous m'indiquer… ? » · « Je <strong>voudrais</strong>… »"]]},{"type":"callout","variant":"accent","title":"L'examinateur insiste :","html":"les <strong>mots interrogatifs</strong> sont la base de l'interrogation, et les <strong>deux temps verbaux (subjonctif et conditionnel)</strong> sont « extrêmement importants pour démontrer votre niveau grammatical »."},{"type":"callout","variant":"warn","title":"Orthographe à fixer :","html":"on écrit <strong>« puis-je »</strong> (avec trait d'union), <strong>« y a-t-il »</strong> (le <em>-t-</em> est juste euphonique, pas d'apostrophe), <strong>« faut-il que »</strong> (verbe <em>falloir</em>), et <strong>« à me consacrer »</strong> (infinitif). Pensez aussi à apporter votre <strong>propre stylo</strong> : une feuille de brouillon vous est fournie pour la préparation."}]},{"band":"Comprendre","id":"t2-structure-activite","title":"La structure de l'activité (les 3 min 30)","blocks":[{"type":"steps","items":[{"n":"1","titre":"Introduction","color":"var(--cat-immigration)","duree":"15-20 s","desc":"Reprenez la consigne <strong>avec vos propres mots</strong> et plantez le contexte. Fixez le registre : <strong>vous</strong> si c'est formel, <strong>tu</strong> si la consigne dit que c'est un(e) ami(e)."},{"n":"2","titre":"Développement","color":"var(--cat-travail)","duree":"~3 min","desc":"Le cœur : <strong>interrogez l'examinateur, posez des questions sans arrêt.</strong> Même si vous avez tout préparé, <strong>écoutez ses réponses et rebondissez</strong> — c'est un exercice <em>en interaction</em>."},{"n":"3","titre":"Conclusion","color":"var(--cat-sante)","duree":"~10 s","desc":"Remerciez et <strong>prenez congé</strong> (formellement ou non, selon le registre)."}]}]},{"band":"Comprendre","id":"t2-situations","title":"Types de situations fréquentes","blocks":[{"type":"tags","items":["S'inscrire à une association ou à un service","Se renseigner sur les transports","Questionner un propriétaire / une gardienne d'immeuble","Organiser un événement (fête, sortie)","Choisir un restaurant ou un prestataire avec un ami","Interroger un futur prestataire (baby-sitter, cat-sitter…)","Démarches administratives","Démarches scolaires","Démarches professionnelles"]}]},{"band":"Comprendre","id":"t2-reflexes","title":"6 réflexes & erreurs fréquentes","blocks":[{"type":"reflexes","items":["<strong>C'est un dialogue, pas une liste.</strong> Écoutez les réponses et rebondissez dessus : « Ah, d'accord. Et dans ce cas, est-ce que… ? »","<strong>Couvrez tout l'objectif</strong> : assurez-vous d'avoir obtenu toutes les infos demandées avant la fin.","<strong>Adaptez le registre</strong> au rôle indiqué : <em>vous</em> par défaut avec l'examinateur ; <em>tu</em> seulement si la consigne dit que c'est un ami / un proche.","<strong>Soyez poli(e) du début à la fin</strong> : saluer, remercier, prendre congé.","<strong>Variez vos questions</strong> : ouvertes (« Comment ça marche ? ») et précises (« Combien ça coûte ? »).","<strong>Tenez jusqu'au bout des 3 min 30</strong> : s'il reste du temps, approfondissez (« Et si jamais… ? »)."]},{"type":"reflexes","variant":"danger","items":["<strong>Réciter ses questions</strong> sans écouter les réponses → l'interaction tombe à plat.","<strong>Mauvais registre</strong> : tutoyer un employé officiel, ou vouvoyer un ami décrit comme proche.","Des questions <strong>trop fermées</strong> (réponses « oui / non ») qui ne font pas avancer l'échange.","<strong>Finir trop tôt</strong> parce qu'on a « posé ses questions » : il faut occuper le temps et relancer.","Oublier de <strong>saluer / remercier</strong> : la politesse fait partie de la note d'interaction."]}]},{"band":"Voir","id":"t2-sim-appartement","title":"Simulation 1 — Louer un appartement","blocks":[{"type":"prose","html":"<p>Deux interactions entières, de l'ouverture polie jusqu'aux remerciements. Les <strong>structures à caser</strong> y reviennent, en gras. Observez que le candidat <strong>écoute la réponse</strong> et <strong>rebondit</strong> à chaque tour, au lieu de réciter une liste.</p>"},{"type":"dialogue","consigne":"Vous cherchez un logement à Montréal. Vous téléphonez au propriétaire d'un appartement (l'examinateur) pour obtenir des informations et organiser une visite.","turns":[{"who":"Vous","html":"Bonjour, je vous appelle au sujet de l'appartement que vous proposez à la location. Excusez-moi de vous déranger, <strong>auriez-vous quelques minutes à me consacrer</strong> ?"},{"who":"Examinateur","html":"Bonjour, oui, bien sûr. Je vous écoute."},{"who":"Vous","html":"Merci beaucoup. <strong>Puis-je</strong> vous poser quelques questions sur le logement ? Pour commencer, est-il toujours disponible ?"},{"who":"Examinateur","html":"Oui, il est encore libre, à partir du mois prochain."},{"who":"Vous","html":"Parfait. <strong>Y a-t-il</strong> des électroménagers inclus, comme un réfrigérateur et une cuisinière ?"},{"who":"Examinateur","html":"Oui, la cuisine est équipée, et le chauffage est compris dans le loyer."},{"who":"Vous","html":"Très bien, c'est un bon point. Et <strong>faut-il que</strong> je fournisse des documents particuliers pour faire une demande ?"},{"who":"Examinateur","html":"Il faut une preuve de revenus et une pièce d'identité."},{"who":"Vous","html":"D'accord, je note. <strong>Si</strong> je vous envoie mon dossier cette semaine, est-ce que je <strong>pourrai</strong> visiter l'appartement rapidement ?"},{"who":"Examinateur","html":"Bien sûr, on organise une visite dès que je reçois votre dossier."},{"who":"Vous","html":"C'est noté. Une dernière question, si vous permettez : les animaux sont-ils acceptés ? J'ai une petite chienne très calme."},{"who":"Examinateur","html":"Oui, les animaux sont acceptés, sans problème."},{"who":"Vous","html":"Je vous remercie infiniment pour toutes ces informations. Je vous envoie mon dossier au plus vite. Bonne journée !"}]}]},{"band":"Voir","id":"t2-sim-cours-francais","title":"Simulation 2 — S'inscrire à un cours de français","blocks":[{"type":"dialogue","consigne":"Vous souhaitez vous inscrire à un cours de français pour adultes. Vous vous rendez dans un organisme de francisation et vous posez vos questions à la personne à l'accueil (l'examinateur).","turns":[{"who":"Vous","html":"Bonjour ! Excusez-moi de vous déranger, <strong>auriez-vous quelques minutes à me consacrer</strong> ? J'aimerais m'inscrire à vos cours de français."},{"who":"Examinateur","html":"Bonjour, bien sûr ! Asseyez-vous, je vais vous renseigner."},{"who":"Vous","html":"Merci. <strong>Puis-je</strong> d'abord savoir quels niveaux vous proposez ?"},{"who":"Examinateur","html":"Nous avons des cours du débutant jusqu'au niveau avancé."},{"who":"Vous","html":"Très bien. <strong>Y a-t-il</strong> des cours le soir ou le week-end ? Je travaille à temps plein en semaine."},{"who":"Examinateur","html":"Oui, nous proposons des cours en soirée, deux fois par semaine."},{"who":"Vous","html":"C'est parfait pour moi. <strong>Faut-il que</strong> je passe un test de niveau avant de m'inscrire ?"},{"who":"Examinateur","html":"Oui, un petit test de placement est nécessaire pour vous orienter vers le bon groupe."},{"who":"Vous","html":"Je comprends. Et <strong>si</strong> je m'inscris aujourd'hui, quand est-ce que je <strong>pourrai</strong> commencer les cours ?"},{"who":"Examinateur","html":"La prochaine session débute dans deux semaines."},{"who":"Vous","html":"Excellent. Dernière chose : les cours sont-ils gratuits, ou y a-t-il des frais d'inscription ?"},{"who":"Examinateur","html":"Pour les nouveaux arrivants, les cours sont gratuits."},{"who":"Vous","html":"C'est une très bonne nouvelle ! Je vous remercie beaucoup pour vos réponses. Je passe le test de niveau dès que possible. Bonne journée !"}]}]},{"band":"Voir","id":"t2-mini-exemple","title":"Mini-exemple — Association sportive","blocks":[{"type":"dialogue","consigne":"Vous souhaitez vous inscrire à une association sportive de votre quartier. Posez des questions au responsable (l'examinateur) pour obtenir toutes les informations utiles.","turns":[{"who":"Vous","html":"Bonjour ! Excusez-moi de vous déranger, <strong>auriez-vous quelques minutes à me consacrer</strong> ? J'aimerais m'inscrire à votre association. <strong>Puis-je</strong> vous poser quelques questions ?"},{"who":"Examinateur","html":"Bien sûr, je vous en prie."},{"who":"Vous","html":"Merci. Tout d'abord, <strong>quels sports</strong> proposez-vous ? Et <strong>y a-t-il</strong> un tarif réduit pour les étudiants ?"},{"who":"Examinateur","html":"Nous proposons du football, du basket et de la natation, et oui, les étudiants ont une réduction."},{"who":"Vous","html":"Parfait. <strong>Faut-il que</strong> je m'inscrive à l'avance, ou puis-je venir directement au premier entraînement ?"},{"who":"Examinateur","html":"Il vaut mieux s'inscrire en ligne avant."},{"who":"Vous","html":"D'accord. Et <strong>si</strong> je m'inscris aujourd'hui, est-ce que je <strong>pourrai</strong> commencer dès cette semaine ?"},{"who":"narr","html":"(…vous enchaînez : horaires, matériel nécessaire, paiement, jusqu'à la fin du temps.)"}]}]},{"band":"S'entraîner","id":"t2-boite-outils","title":"Boîte à outils — poser de bonnes questions","blocks":[{"type":"prose","html":"<p>Touchez une phrase pour la copier. Variez la forme de vos questions : les <strong>mots interrogatifs</strong>, les trois registres, et surtout les <strong>formules polies</strong>, très valorisées.</p>"},{"type":"phrasebank","groups":[{"label":"Les mots interrogatifs","phrases":["combien","quand","où","comment","pourquoi","quel(le)","à quelle heure","à partir de quand"]},{"label":"Trois façons de poser une question","phrases":["Familière : « Vous avez des horaires le week-end ? »","Standard : « Est-ce que vous êtes ouverts le week-end ? »","Soutenue (inversion) : « Êtes-vous ouverts le week-end ? »"]},{"label":"Les formules polies (très valorisées)","phrases":["Pourriez-vous me dire… / m'indiquer… ?","J'aimerais savoir si… / combien… / quand… ","Est-ce qu'il serait possible de… ?","Une dernière question, si vous permettez : …"]},{"label":"Pour ouvrir","phrases":["Bonjour, je vous appelle / je viens vous voir au sujet de…","Excusez-moi de vous déranger, auriez-vous quelques minutes à me consacrer ?","J'aurais quelques questions à vous poser, si vous permettez."]},{"label":"Pour demander","phrases":["Pourriez-vous m'expliquer comment… ?","J'aimerais savoir si…","Quelles sont les conditions pour… ?"]},{"label":"Pour relancer","phrases":["D'accord, et dans ce cas… ?","Très bien. Et qu'en est-il de… ?","Vous avez parlé de X ; pourriez-vous préciser ?"]},{"label":"Pour conclure","phrases":["Je crois que j'ai toutes les informations. Je vous remercie beaucoup.","Parfait, merci pour vos réponses. Bonne journée !"]}]}]},{"band":"S'entraîner","id":"t2-banque-consignes","title":"Banque de consignes réelles","blocks":[{"type":"prose","html":"<p>Des consignes du type de celles de l'examen. Pour chacune : repérez le <strong>registre</strong> (<em>tu</em>/<em>vous</em>), faites le <strong>brainstorm de sous-thèmes</strong>, et visez <strong>12-18 questions</strong>.</p>"},{"type":"consignes","items":[{"n":1,"registre":"vous","type":"Logement","text":"Je propose une chambre à louer dans mon appartement. Vous avez vu mon annonce. Vous venez visiter l'appartement et vous me posez des questions (loyer, meubles, vie en commun…)."},{"n":2,"registre":"tu","type":"Événement","text":"Je suis votre ami(e), je vous invite à la soirée d'ouverture d'un grand restaurant. Vous me posez des questions sur l'événement (tenue appropriée, menu, déroulement…)."},{"n":3,"registre":"tu","type":"Service","text":"Je suis votre collègue. Je ne pourrai pas aller chercher mes parents à l'aéroport ce week-end. Vous me proposez de rendre ce service et me demandez les informations nécessaires (dates, vol, description physique…)."},{"n":4,"registre":"tu","type":"Achat","text":"Je suis votre collègue. Vous avez lu mon annonce au travail : je revends mes meubles. Vous êtes intéressé(e) : vous me posez des questions (état, prix, taille…)."},{"n":5,"registre":"tu","type":"Quartier","text":"Je suis votre voisin(e). Vous venez d'emménager dans l'immeuble. Vous me posez des questions sur les activités du quartier (commerces, activités culturelles et sportives…)."},{"n":6,"registre":"tu","type":"Quartier","text":"Je suis votre voisin(e). Nous nous sommes rencontrés dans l'ascenseur. Posez-moi des questions (voisinage, commerces, activités…)."},{"n":7,"registre":"vous","type":"Vacances","text":"Je suis agent immobilier. Vous voulez réserver un chalet au bord de la mer pour les vacances. Posez-moi des questions."},{"n":8,"registre":"tu","type":"Éducation","text":"Je suis votre voisin(e). Vous venez d'arriver à Montréal et cherchez une école pour vos enfants. Posez-moi des questions."},{"n":9,"registre":"tu","type":"Logement","text":"Je suis votre collègue. Je vous propose une chambre en colocation et vous êtes intéressé(e). Posez-moi des questions."},{"n":10,"registre":"vous","type":"Loisirs","text":"Je travaille à l'accueil d'une école de danse. Vous êtes intéressé(e) par des cours. Posez-moi des questions."},{"n":11,"registre":"tu","type":"Travail","text":"Je suis un(e) ami(e). Vous cherchez un emploi et passez un entretien la semaine prochaine. Demandez-moi des conseils pour réussir (comportement, vêtements, préparatifs…)."},{"n":12,"registre":"tu","type":"Service","text":"Je suis votre voisin(e). Je pars en vacances et aimerais que vous gardiez mon animal. Posez-moi des questions pour décider si vous acceptez (dates, habitudes, règles…)."},{"n":13,"registre":"vous","type":"Vacances","text":"Je travaille dans un office de tourisme. Vous voulez partir en week-end sans trop dépenser. Demandez-moi des conseils (lieux, activités, transports…)."},{"n":14,"registre":"vous","type":"Sport","text":"Je travaille à l'accueil d'un club sportif. Vous voulez faire du sport. Posez-moi des questions pour décider de vous inscrire (cours, tarifs, horaires…)."},{"n":15,"registre":"tu","type":"Logement","text":"Nous sommes amis. Vous voulez vous installer au Canada ; j'ai une chambre en colocation à Toronto à vous proposer. Posez-moi des questions pour décider (appartement, quartier, habitudes de vie…)."}]},{"type":"callout","variant":"info","title":"Sujets fréquents :","html":"les études · les langues · le travail · les vacances · les activités culturelles · les associations · la vie à l'étranger · les transports en commun."},{"type":"callout","variant":"accent","title":"S'entraîner à l'oral :","html":"demandez à la commande <strong>/tcf-pratique</strong> de vous donner une consigne de Tâche 2 et de jouer l'interlocuteur ; il répond à vos questions, puis corrige le registre et les tournures."}]}]},{"id":"t3","num":3,"title":"Expression d'un point de vue","eyebrow":"Tâche 3 · Point de vue","duree":"4 min 30","prep":"Sans préparation","desc":"Vous défendez un avis structuré, en continu, pendant 4 min 30. La tâche la plus exigeante — et la plus travaillée ici.","lede":"La dernière et la plus exigeante : on vous lit une affirmation ou une question, et vous tenez un discours organisé et fluide pendant environ 4 min 30, sans préparation.","sections":[{"band":"Comprendre","id":"t3-format","title":"Le format","blocks":[{"type":"format","rows":[["Durée","<strong>~4 min 30</strong> de parole en continu"],["Préparation","<strong>Aucune</strong> — « expression d'un point de vue sans préparation »"],["Ce que vous faites","Vous <strong>défendez un avis</strong> sur un sujet donné, de façon spontanée, continue et convaincante"],["Objectif B2","Discours <strong>organisé</strong> (intro → arguments → conclusion), connecteurs, exemples concrets, une nuance"]],"badges":[{"icon":"clock","label":"4 min 30","cls":"badge-brand"},{"label":"Pas de préparation","cls":"badge-accent"}]},{"type":"callout","variant":"warn","title":"Pas de temps de préparation.","html":"Vérifié auprès de France Éducation International : vous répondez <strong>spontanément</strong>. L'enjeu n'est pas de « préparer puis parler » : c'est de <strong>tenir un discours fluide et organisé pendant 4 min 30 sans blanc</strong>. C'est tout l'objet de cet entraînement."},{"type":"callout","variant":"info","title":"C'est un monologue.","html":"Contrairement aux Tâches 1 et 2, il n'y a pas d'échange de questions-réponses : visez un discours autonome qui tient tout seul jusqu'au bout. <strong>Un examinateur peut toutefois vous interrompre si votre discours n'est pas clair</strong> — un signal pour clarifier, pas une aide pour remplir le temps."}]},{"band":"Comprendre","id":"t3-structure","title":"La structure en 5 parties","blocks":[{"type":"prose","html":"<p>Une trame passe-partout qui marche pour <strong>presque tous les sujets</strong>. Pour tenir ~4 min 30, chaque argument doit être étoffé : <strong>idée → explication (En effet…) → exemple concret (Par exemple…) → mini-bilan</strong>. Ne vous contentez pas d'une phrase par argument.</p>"},{"type":"steps","items":[{"n":"1","titre":"Introduction","color":"var(--cat-immigration)","duree":"~30 s","desc":"Reformuler le sujet (jamais mot pour mot) + annoncer sa position + annoncer le plan. Astuce : généralisez d'ab
